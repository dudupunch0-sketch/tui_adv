low_pressure_hook: 이름을 드러내지 않고 다른 채무자의 증언을 들을지, 청류문 물자 공백과 장부선을 대조할지, 서하린에게 기록의 위험을 설명할지 고를 수 있다.
next_reentry_trigger: 조각과 객패 경로가 안전하게 봉인되고 며칠의 회복 뒤 서하린의 손목과 공동 책임을 확인할 준비가 되면 2/15가 열린다.
