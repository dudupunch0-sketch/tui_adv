  source_ref: docs/content/design_source/events/authored/wuxia_guestpass_bloodmoon_qingliu_network_destruction.yml
  required_flags: [wuxia_cheongryu_raid_omen_resolved, bloodmoon_raid_omen_enabled, guestpass_burnt_token_acquired]
  common_emits: [bloodmoon_qingliu_network_destruction_resolved, qingliu_physical_losses_confirmed_pending_roll_call, guestpass_outpost_physically_destroyed, bloodmoon_role_physical_terror_locked, guestpass_route_to_damage_roll_call_opened]
  next_gate: bloodmoon_qingliu_network_destruction_resolved
