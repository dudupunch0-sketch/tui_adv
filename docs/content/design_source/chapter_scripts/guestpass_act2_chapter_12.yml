  common_minimum_facts: [qingliu_raid_aftermath_roll_call_resolved, qingliu_survivor_names_recorded, guestpass_survivor_names_checked, guestpass_destroyed_network_mark_preserved, guestpass_first_owner_route_order_partial, guestpass_first_owner_decode_partial_resolved, guestpass_partial_decode_recorded, guestpass_first_owner_route_narrowed, guestpass_decode_names_and_two_traces_resolved, guestpass_tianjilu_shortcut_refused, guestpass_romance_lock_preserved]
