insights:
  - id: insight_breathe_before_bargain
    name: 호흡을 먼저 고른 기록
    description: 서하린의 경계 앞에서 숨을 고르고 말의 순서를 세웠다.
    check_bonus:
      ability: empathy
      bonus: 1

  - id: insight_read_the_flow
    name: 흐름을 읽은 기록
    description: 발을 멈추지 않고 상대의 힘이 빠지는 순간을 기록했다.
    check_bonus:
      ability: physical
      bonus: 1

  - id: insight_name_the_rule
    name: 규칙을 이름 붙인 기록
    description: 낯선 문파의 규칙을 문장으로 정리해 다음 판단의 발판으로 삼았다.
    check_bonus:
      ability: logic
      bonus: 1

  - id: wuxia_insight_first_current_breath
    name: 청류심법의 첫 숨
    description: 힘을 고정하는 대신 흐르게 해야 한다는 청류심법의 첫 이해.
    reveal_immediate: true

  - id: wuxia_insight_recording_defeat
    name: 패배를 받아 적는 습관
    description: 패배를 손실이 아니라 다음 시도의 자료로 바꾸는 기연.
    reveal_immediate: true

  - id: wuxia_insight_measure_fidelity
    name: 신의를 저울질하는 마음
    description: 신의가 언제나 이익이 되는 것은 아니지만, 무엇을 잃는지는 스스로 재는 마음.
    reveal_immediate: true

  - id: wuxia_insight_sort_like_documents
    name: 서류처럼 정리하는 머리
    description: 현대의 기록 습관이 약재 장부와 문파의 결핍을 연결하는 방식으로 재해석된 기연.
    reveal_immediate: true

  - id: wuxia_insight_read_the_wrist
    name: 손목의 맥을 읽는 눈
    description: 서하린이 숨긴 손목의 미세한 움직임에서 말하지 않은 상태를 읽는 이해.
    reveal_immediate: true
