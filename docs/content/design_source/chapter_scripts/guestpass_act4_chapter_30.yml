reentry_recap: 객패 장부의 지연 계략으로 기록은 사라지지 않고 늦게 도착하게 되었다. 서하린과 주인공은 사도의 첫 거래 자리에서, 통행권·원장부·귀환 단서가 각각 다른 가격표에 놓인다는 사실과 마주한다.
stable_opening: 낮의 장부실 옆 빈 객실, 주인공은 현대 몸과 출근복을 그대로 둔 채 사원증을 뒤집어 탁자에 놓는다. 서하린은 사도의 세 상자를 직접 확인하고, 어느 것도 대신 결정하지 않겠다는 선을 긋는다.
local_urgent_conflict: 사도는 객패 통행권, 흑사방 원장부 접근권, 현대 귀환 단서를 한꺼번에 주지 않고 분리 가격화한다. 거래를 수락해도 사람·이름·관계를 담보로 넘기지 않으며 최종전·물리파괴·채무 거래 반복은 없다.
beats_and_dialogue:
  - {beat: 세 개의 상자, scene: 사도가 통행권·원장부 열람패·귀환 단서 표식을 서로 다른 상자에 둔다., dialogue: '사도: “통행은 길의 값이고, 원장부는 빚의 값이며, 귀환은 네가 돌아갈 자유의 값이지.”'}
  - {beat: 가격표의 분리, scene: 객패 통행권은 이동 권리, 원장부는 접근 권리, 귀환 단서는 방향 정보로 각각 분리되어 있음을 확인한다., dialogue: '주인공: “권한을 세 종류로 나누면, 하나를 얻고 나머지를 잃는 계약이 되겠군요.”'}
  - {beat: 서하린의 독립 판단, scene: 서하린은 자신의 신뢰와 이름을 담보로 계산하지 않고, 각 제안의 숨은 통제자를 따로 표시한다., dialogue: '서하린: “제가 동의할 수 있는 것과, 누구도 제 이름으로 결정할 수 없는 것은 따로예요.”'}
  - {beat: 현대인의 역질문, scene: 주인공은 회사의 결재선·접근권·버전 기록 감각으로 가격을 정하는 자와 검증하는 자를 구분한다., dialogue: '주인공: “가격표가 있다고 소유권이 생기는 건 아닙니다. 누가 검증할 권한을 가졌는지부터 보죠.”'}
  - {beat: 계산표의 틈, scene: 거래 수락·역질문·미끼·가격 밖 선언 중 하나로 사도의 검증 순서와 원장부 회수 경로의 한 층을 드러낸다., dialogue: '사도: “거절해도 다음 비용은 내가 정한다. 네가 가진 선택도 계산 안에 있으니까.”'}
  - {beat: 장내 결산, scene: 선택한 패찰·산식표·역탁본·이름표를 봉인하고 식사와 휴식 뒤 원장부 회수 준비를 정한다., dialogue: '서하린: “오늘 끝난 건 거래의 승패가 아니에요. 무엇을 가격에 올리지 않을지 정한 일이에요.”'}
