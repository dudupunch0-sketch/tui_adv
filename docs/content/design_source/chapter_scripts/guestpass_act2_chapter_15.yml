reentry_recap: 2/14 흑사방 채무 장부에서 객패의 이동 흔적과 다음 역참의 빈칸을 확인했다. 청류문은 다시 일상을 세우고 있고, 주인공은 장부 대조를 거들며 서하린이 늘 먼저 연무장에 나오는 이유를 눈치챘다.
stable_opening: 해가 뜨기 전 세면터에서 서하린은 왼손으로 물동이를 옮긴다. 손목을 숨긴 소매에서 물이 한 번 기울고 장부의 먹선이 번진다. 오늘의 일은 부상을 해결하고, 누구도 대신 결정하지 않는 것이다.
local_urgent_conflict: 오래된 손목 부상이 장부와 당번을 방해한다. 걱정을 핑계로 서하린의 선택권을 빼앗거나, 침묵으로 부담을 떠넘길 수 있다. 치료는 이 장면에서 시작되고 일상으로 닫히며, 치유 기적과 romance lock은 없다.
beats_and_dialogue:
  - beat: 물동이의 기울기
    scene: 서하린은 괜찮다고 말하지만 주인공은 손목보다 오늘 맡을 수 있는 일을 묻는다.
    dialogue: '서하린: “다친 건 오래됐어요. 오늘 갑자기 생긴 일처럼 말하지 마요.”'
  - beat: 장부와 붕대
    scene: 객패 경로를 옮겨 적던 종이에 약재 가루가 묻는다. 둘은 장부를 접고 흔적을 따로 보존한다.
    dialogue: '주인공: “기록은 남길게요. 이 손목을 기록 때문에 더 쓰게 하진 않을게요.”'
  - beat: 선택권의 반환
    scene: 주인공은 누구에게 알릴지 정하지 않고 서하린에게 묻는다. 그녀는 당번 교대, 약초, 보고 중 원하는 범위를 고른다.
    dialogue: '서하린: “도와준다는 말로 제 일정을 가져가지는 말아요.”'
  - beat: 공동 당번표
    scene: 청우진은 이름을 지우지 않고 물동이·장부·산문 당번을 세 칸으로 나눈다.
    dialogue: '청우진: “책임은 이름을 지우는 일이 아니다. 감당할 몫을 다시 나누는 일이지.”'
  - beat: 손목을 쓰지 않는 연습
    scene: 서하린은 붕대 매듭을 가르치고 주인공은 그녀의 손을 붙잡지 않은 채 자기 손으로 묶는다.
    dialogue: '서하린: “제가 할 수 있게 옆에서 멈춰 주는 거예요.”'
  - beat: 미완성 장부
    scene: 손목은 고정되고 장부는 절반만 정리된다. 저녁 식사와 다음날 회복이 확정된다.
    dialogue: '주인공: “같이 책임진다는 건 같은 속도로 움직인다는 뜻은 아니군요.”'
