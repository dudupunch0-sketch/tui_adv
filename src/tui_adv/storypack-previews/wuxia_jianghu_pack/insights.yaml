insights:
  - id: insight_breathe_before_bargain
    name: 호흡을 먼저 고른 기록
    description: 서하린의 경계 앞에서 숨을 고르고 말의 순서를 세웠다.
    check_bonus:
      ability: empathy
      bonus: 1

  - id: insight_read_the_flow
    name: 흐름을 읽은 기록
    description: 발을 멈추지 않고 상대의 힘이 빠지는 순간을 기록했다.
    check_bonus:
      ability: physical
      bonus: 1

  - id: insight_name_the_rule
    name: 규칙을 이름 붙인 기록
    description: 낯선 문파의 규칙을 문장으로 정리해 다음 판단의 발판으로 삼았다.
    check_bonus:
      ability: logic
      bonus: 1

  - id: first_current_breath
    name: 첫 물결의 호흡
    description: 청류문의 첫 호흡을 몸에 남겼지만, 기록은 아직 빈칸으로 남아 있다.
    reveal_immediate: false

  - id: recording_defeat
    name: 패배를 기록하는 법
    description: 실패를 지우지 않고 다음 선택의 재료로 보관한다.
    reveal_immediate: true

  - id: measure_fidelity
    name: 충실도를 재다
    description: 약속과 실제 행동 사이의 간격을 감정 대신 기록으로 살핀다.
    reveal_immediate: true

  - id: sort_like_documents
    name: 문서처럼 분류하기
    description: 흩어진 단서를 같은 서랍에 넣기 전, 무엇이 다른지 먼저 구분한다.
    reveal_immediate: false

  - id: read_the_wrist
    name: 손목을 읽다
    description: 짧은 움직임에 남은 긴장과 망설임을 읽는다.
    reveal_immediate: false
