titles:
  - id: wuxia_title_not_yet_disciple
    name: 제자 아닌 제자
    concept: 문파의 호칭은 받지 못했지만 수련장에 계속 남은 외부인.
    rarity: 희귀
    category: 사이드
    reveal_immediate: true
  - id: wuxia_title_guest_of_cheongryu
    name: 청류문의 손님
    concept: 아직 제자는 아니지만 밥상과 장작 당번의 자리를 받은 사람.
    rarity: 보통
    category: 메인
    reveal_immediate: true
  - id: wuxia_title_keeper_of_returning_name
    name: 돌아갈 이름을 품은 자
    concept: 새 세계에 머물면서도 원래 이름을 완전히 버리지 않은 사람.
    rarity: 희귀
    category: 다회차
    reveal_immediate: true
  - id: wuxia_title_badge_bearer
    name: 사원증을 품은 자
    concept: 낯선 세계에서도 자기 이름과 과거를 버리지 않은 사람.
    rarity: 보통
    category: 사이드
    reveal_immediate: true
  - id: wuxia_title_footprints_of_two_paths
    name: 두 길의 발자국
    concept: 한쪽을 택했지만 다른 길의 흔적도 끝까지 추적한 사람.
    rarity: 전설
    category: 히든
    reveal_immediate: true
