reentry_recap: 낡은 흑사방 두건에서 객패 노선과 회수선이 겹친다는 단서를 얻었다. 직접 쫓거나 맞설 때는 아니지만, 청류문 외원에 남은 낯선 발걸음 하나가 그 교차점을 다시 건드린다.
stable_opening: 다음 날 아침, 외원 담장 너머로 흑사방 심부름꾼이 지나간다. 거친 걸음 사이에서 장작 마당에서 배운 청류문식 흐름이 한 번 반짝이고, 서하린은 이름을 부르려다 입을 다문다.
local_urgent_conflict: 낯선 사람이 청류문식 움직임을 훔쳐 쓰는 순간을 어떻게 기록할지 정한다. 목격은 장면 안에서 끝내며 무명과의 대치, 추격전, 출동 명령은 시작하지 않는다.
beats_and_dialogue:
  - {beat: 담장 너머의 발걸음, scene: 외원 장작더미 사이로 흑사방 표식이 희미한 심부름꾼이 지나가며 팔꿈치를 접는다., dialogue: '주인공: “저 동작, 청류문에서 배운 흐름과 닮았습니다. 그런데 중심이 비어 있어요.”'}
  - {beat: 훔친 흐름의 빈자리, scene: 발끝과 어깨의 순서는 청류문식이지만 호흡이 이어지지 않아 한 박자 늦게 무너진다., dialogue: '서하린: “모양을 가져갔다고 길까지 가져간 건 아니에요. 저 사람은 흐름을 빌렸을 뿐이에요.”'}
  - {beat: 삼킨 이름, scene: 서하린이 한 걸음 나서려다 손목을 감싸고 멈춘다. 이름 대신 침묵이 먼저 드러난다., dialogue: '주인공: “아는 사람입니까?” 서하린: “지금은 이름보다, 왜 저렇게 걷는지부터 봐요.”'}
  - {beat: 짧은 선택의 거리, scene: 심부름꾼은 뒤돌아보지 않고 물길 쪽으로 빠진다. 주인공은 담장 안에 남을지 짧게 흔적을 좇을지 판단한다., dialogue: '객잔 주인: “외원 문턱을 넘으면 목격이 아니라 손님 일로 커집니다. 오늘은 선을 정합시다.”'}
  - {beat: 기록의 네 칸, scene: 청류문식 모양·비어 있는 중심·흑사방 표식·사라진 방향을 나누어 장부에 적는다., dialogue: '주인공: “무명이라는 이름을 붙이기 전에, 본 것과 짐작을 갈라 적겠습니다.”'}
  - {beat: 점심 뒤의 평온, scene: 장작을 옮기고 서하린의 손목을 쉬게 한 뒤 목격 기록을 봉인한다. 담장 밖에는 아무도 남지 않는다., dialogue: '서하린: “오늘은 알아본 것만으로 충분해요. 다음에 다시 보게 되면, 그때 질문할 수 있게요.”'}
