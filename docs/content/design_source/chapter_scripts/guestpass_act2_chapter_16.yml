    flags: {always: [qingliu_first_departure_cost_resolved, qingliu_departure_staging_opened, first_route_cost_recorded, trace_pursuit_spent], success: [first_route_partially_confirmed, seoharin_field_limit_respected], failure: [route_evidence_washed_out, wrist_care_cost_carried_forward]}
