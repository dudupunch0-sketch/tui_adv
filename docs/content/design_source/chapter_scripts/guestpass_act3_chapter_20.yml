event_ref: wuxia_guestpass_one_eye_mountain_bearer_passage
slot: 3/20
title: 외안배산귀 통과
entry_conditions:
  required_flags: [guestpass_route_to_baesan_opened, guestpass_stewardship_accepted]
  optional_flags: [guestpass_broken_relay_seal_recovered, guestpass_next_mountain_soil_identified, qingliu_absent_name_preserved]
status: authoring_draft
review_status: authoring_review_required
runtime_status: not_implemented
reward_policy:
  mode: mutually_exclusive_by_choice
  unique_group: guestpass_act3_ch20_baesan_reward
  hidden_route_exception_only: true
  unchosen_evidence_recovery: true
canonical_bridge:
  source_gap: true
  source_refs: [wuxia_guestpass_one_eye_mountain_bearer_passage]
  required_flags: [guestpass_route_to_baesan_opened, guestpass_stewardship_accepted]
  common_emits: [guestpass_one_eye_mountain_bearer_passage_resolved, one_eye_mountain_bearer_survival_preserved, guestpass_next_destination_trace_opened, guestpass_name_preservation_theme_reinforced, guestpass_route_to_next_movement_trace_opened]
  next_gate: guestpass_route_to_next_movement_trace_opened
  next_event_ref: wuxia_route_return_scent_clue
  note: authored 원본의 4 choice ID·비살상 원칙·flags를 보존한다. 환상은 이름돌과 시선이 잠깐 겹쳐 보이는 제한적 현상으로만 쓰며 대치는 산길 안에서 종결한다.
reentry_recap: 청류문 빈방의 압류 현장은 닫혔고, 며칠의 식사와 수리를 거쳐 산길 통행 책임을 맡을 준비가 되었다. 주인공은 현대의 출근복과 사원증을 그대로 지닌 채 서하린과 무너진 귀로객망 중계소에 도착한다.
stable_opening: 바람이 잦은 오후, 무너진 중계소 너머에서 바위 능선처럼 굽은 등이 길을 가린다. 외안배산귀는 돌무더기 아래서 이름 패찰을 꺼내지만 공격하지 않고, 누가 이 길의 손님을 책임지는지 기다린다.
local_urgent_conflict: 혈월교가 태운 이름돌과 끊긴 환대 규칙 때문에 배산귀는 이름 없는 침입자와 이름을 빼앗긴 피난민을 구분하지 못한다. 오늘의 목표는 상대를 쓰러뜨리는 것이 아니라 대치를 비살상으로 닫고 다음 이동 흔적을 회수하는 것이다.
beats_and_dialogue:
  - beat: 등에 진 산
    scene: 외안배산귀의 큰 눈 하나가 사람보다 무너진 표식과 돌 아래 패찰을 먼저 살핀다. 외형은 약점이나 조롱의 대상이 아니라 오래된 길의 책임을 짊어진 존재로 제시된다.
    dialogue: '외안배산귀: “산은 내 등에 있고, 이름은 돌 밑에 있다. 지나가는 자는 무엇을 맡고 가는가?”'
  - beat: 끊긴 환대의 규칙
    scene: 서하린은 부서진 식사 자리와 불탄 명부 조각을 확인한다. 혈월교의 흔적은 물리적 훼손으로만 남고, 누가 지금 지시하는 적대 세력이라는 식으로 확대하지 않는다.
    dialogue: '서하린: “길이 끊긴 건 맞지만, 저 존재가 그 일을 했다고 단정할 흔적은 없어요. 먼저 지키는 게 뭔지 봐요.”'
  - beat: 한 끼와 객패
    scene: 주인공은 객패를 소유물처럼 흔들지 않고 맡은 책임과 목적을 말한다. 출근복 주머니의 간단한 식량을 꺼내며 식사 순서가 규칙의 일부였음을 묻는다.
    dialogue: '주인공: “이건 내 통행증이 아니라 맡아 둔 약속이에요. 먹을 것을 나누고, 누구를 어디까지 데려갈지 말하겠습니다.”'
  - beat: 시선이 머문 이름돌
    scene: 배산귀의 시선은 무기보다 불탄 이름돌과 중계 표식에 오래 머문다. 잠깐 돌의 금이 이전 배열과 겹쳐 보이는 제한적 환상이 생기지만, 천기록의 계시나 정답으로 해석하지 않는다.
    dialogue: '외안배산귀: “한 눈이면 충분하다. 보이는 것 모두가 아니라, 지켜야 할 것부터 본다.”'
  - beat: 기한이 있는 이름
    scene: 주인공은 본명을 빼앗길 위험과 이름 없는 사람을 지울 위험 사이에서 역할 이름, 관찰, 객패 협상, 구조물 제압 중 하나를 선택한다. 서하린은 공동 증인이 되되 주인공의 이름을 대신 결정하지 않는다.
    dialogue: '서하린: “네 이름을 숨길지 말지는 네가 정해. 다만 내가 같이 들었다는 사실과 끝나는 조건은 남길게.”'
  - beat: 돌팔의 비살상 대치
    scene: 통과가 막히면 돌팔과 낙석 구조만 빈 지면으로 유도할 수 있다. 패찰과 이름돌은 피하고, 배산귀의 몸을 쓰러뜨리거나 죽이는 선택은 허용하지 않는다.
    dialogue: '주인공: “사람을 치지 말고 길을 막은 돌만 끊어요. 이름이 있는 돌은 건드리지 않습니다.”'
  - beat: 돌 아래의 다음 이름
    scene: 네 경로 모두 배산귀가 살아 있는 채 대치를 멈추고, 다음 이동지의 이름 패찰·발자국·통과명·이정표 촉 중 하나를 남긴다. 산길은 닫히고 안전한 interlude가 생긴 뒤 귀로 흔적 추적이 열린다.
    dialogue: '외안배산귀: “다음 손님의 이름은 네 것이 아니다. 다만 잊히지 않게 들고 가라.”'
choices:
  - id: negotiate_with_token_and_provisions
    label: 객패를 보이고 한 끼를 먼저 나눈다
    immediate_result: 주인공과 서하린이 길 한가운데 식량을 덜어 놓고 객패가 소유물이 아니라 맡은 책임임을 설명한다.
    success: 배산귀가 경계를 풀고 돌 아래 보존한 다음 손님의 이름 패찰을 건넨다. 환대 규칙은 완전한 복원이 아니라 현재의 약속으로 이어진다.
    failure: 식사와 말의 순서를 어겨 식량을 더 내주지만 배산귀가 객패의 수탁 매듭을 알아보고 공격을 멈춘다. 이름 패찰은 일부만 읽힌다.
    relationship_directions:
      people: {seo_harin: strong_positive_shared_hospitality_choice, one_eye_mountain_bearer: positive_guest_rule_restored}
      factions: {guestpass_network: strong_positive_hospitality_continued, qingliu: positive_values_applied_abroad}
    reward_candidate: {id: guestpass_act3_ch20_reward_one_meal_beyond_gate, name: 산문 밖의 한 끼, type: authored_insight, concept: 규칙이 끊긴 자리에서도 먼저 내어 준 한 끼가 손님과 적을 다시 구분하게 한다는 깨달음, selected_flag: guestpass_act3_ch20_reward_one_meal_beyond_gate_selected, recorded_flag: guestpass_act3_ch20_reward_one_meal_beyond_gate_recorded}
    quest_clue: {id: guestpass_act3_ch20_clue_stone_pressed_guest_tablet, name: 돌 아래 눌린 손님 패찰, type: main_quest_clue, concept: 파괴 직전 다음 중계소로 떠난 사람의 이름과 방향을 비바람에서 지켜 낸 나무패, selected_flag: guestpass_act3_ch20_clue_stone_pressed_guest_tablet_selected, recorded_flag: guestpass_act3_ch20_clue_stone_pressed_guest_tablet_recorded}
    flags:
      always: [baesan_guest_rite_attempted, one_eye_mountain_bearer_survival_preserved, guestpass_one_eye_mountain_bearer_passage_resolved]
      success: [baesan_guest_name_tablet_received, baesan_hospitality_rule_reopened]
      failure: [baesan_extra_provisions_paid, baesan_name_tablet_partially_read]
  - id: read_gaze_and_name_stones
    label: 시선이 머무는 돌의 순서를 읽는다
    immediate_result: 주인공과 서하린은 배산귀의 외형을 약점으로 삼지 않고, 무기보다 불탄 이름돌과 무너진 표식에 시선이 머무는 순서를 관찰한다.
    success: 공격 없이 잃어버린 패찰을 제자리에 놓아 통과 허락과 다음 발자국 방향을 얻는다. 이름돌 배열은 탁본으로 보존된다.
    failure: 돌 하나를 잘못 옮겨 길이 막히지만 서하린과 원상 복구하며 혈월교가 훼손한 표식 순서를 읽는다. 다음 방향은 부분 정보로 남는다.
    relationship_directions:
      people: {seo_harin: positive_patient_joint_observation, one_eye_mountain_bearer: positive_guardianship_understood}
      factions: {guestpass_network: positive_name_memorial_preserved, qingliu: neutral_careful_passage}
    reward_candidate: {id: guestpass_act3_ch20_reward_three_steps_under_one_eye, name: 한눈 아래의 세 걸음, type: authored_skill, concept: 상대가 지키는 대상과 시선의 순서를 읽어 불필요한 충돌 없이 세 걸음 앞을 정하는 관찰법, selected_flag: guestpass_act3_ch20_reward_three_steps_under_one_eye_selected, recorded_flag: guestpass_act3_ch20_reward_three_steps_under_one_eye_recorded}
    quest_clue: {id: guestpass_act3_ch20_clue_gaze_stayed_name_stone_rubbing, name: 시선이 머문 이름돌 탁본, type: investigation_clue, concept: 배산귀가 지키던 이름돌 배열과 혈월교가 부순 순서를 함께 남긴 탁본, selected_flag: guestpass_act3_ch20_clue_gaze_stayed_name_stone_rubbing_selected, recorded_flag: guestpass_act3_ch20_clue_gaze_stayed_name_stone_rubbing_recorded}
    flags:
      always: [baesan_name_stone_order_observed, one_eye_mountain_bearer_survival_preserved, guestpass_one_eye_mountain_bearer_passage_resolved]
      success: [guestpass_next_footprint_direction_read, baesan_name_stones_reordered_safely]
      failure: [bloodmoon_name_stone_destruction_order_seen, baesan_partial_direction_preserved]
  - id: offer_a_role_name_with_limits
    label: 내 이름 대신 맡은 역할을 기한부로 건다
    immediate_result: 주인공은 거짓 무명이 아니라 ‘다음 손님을 보내는 자’라는 역할 이름과 책임이 끝나는 조건을 말한다. 서하린은 공동 증인으로 서지만 이름을 대신 양도하지 않는다.
    success: 역할과 책임이 일치해 배산귀가 두 사람의 통과 이름을 돌에 임시로 새긴다. 기한부 이름은 소유권이 아니라 책임의 기록으로 남는다.
    failure: 역할 문구가 사람을 기능으로만 줄여 거부당하지만, 주인공이 보호할 실제 이름을 다시 말해 길을 연다. 본명은 필요한 만큼만 공개된다.
    relationship_directions:
      people: {seo_harin: strong_positive_co_witness_of_name, one_eye_mountain_bearer: positive_bounded_name_promise}
      factions: {guestpass_network: positive_name_not_owned, qingliu: positive_absent_names_carried}
    reward_candidate: {id: guestpass_act3_ch20_reward_no_clockout_passage, name: 퇴근증 없는 통행법, type: authored_insight, concept: 신분증이 없어도 맡은 책임과 끝나는 조건을 분명히 해 자신을 증명하는 현대인의 이름 전략, selected_flag: guestpass_act3_ch20_reward_no_clockout_passage_selected, recorded_flag: guestpass_act3_ch20_reward_no_clockout_passage_recorded}
    quest_clue: {id: guestpass_act3_ch20_clue_bounded_passage_name_stone, name: 기한부 통과명 돌조각, type: quest_item, concept: 이름을 숨겨 빼앗는 대신 한정된 책임을 공개해 통과했음을 기록한 작은 돌조각, selected_flag: guestpass_act3_ch20_clue_bounded_passage_name_stone_selected, recorded_flag: guestpass_act3_ch20_clue_bounded_passage_name_stone_recorded}
    flags:
      always: [baesan_bounded_role_name_offered, one_eye_mountain_bearer_survival_preserved, guestpass_one_eye_mountain_bearer_passage_resolved]
      success: [baesan_passage_name_witnessed, baesan_bounded_name_recorded]
      failure: [protected_real_name_spoken_after_refusal, baesan_name_disclosure_limited]
  - id: break_the_blocking_stone_arm
    label: 사람 대신 길을 내리치는 돌팔을 꺾는다
    immediate_result: 서하린이 피난 방향을 맡고 주인공은 돌팔의 충격을 이름 패찰이 없는 빈 지면으로 유도한다. 목표는 배산귀가 아니라 길을 봉쇄한 구조물이다.
    success: 배산귀를 쓰러뜨리지 않고 봉쇄 동작을 멈춰 세우며 부서진 중계 이정표의 금속 촉을 확보한다.
    failure: 장비와 체력을 소모하고 밀려나지만 배산귀가 이름돌을 피해서 싸우는 모습을 보고 전투를 중지할 근거를 찾는다. 비살상 후퇴로 대치가 닫힌다.
    relationship_directions:
      people: {seo_harin: positive_coordinated_nonlethal_combat, one_eye_mountain_bearer: mixed_force_used_without_killing}
      factions: {guestpass_network: positive_name_tablets_not_damaged, qingliu: positive_defense_with_restraint}
    reward_candidate: {id: guestpass_act3_ch20_reward_baesan_pressing_strike, name: 배산의 눌러치기, type: authored_skill, concept: 상대의 몸이 아니라 공격이 닿을 자리와 구조물을 제압해 통로를 여는 비살상 전투법, selected_flag: guestpass_act3_ch20_reward_baesan_pressing_strike_selected, recorded_flag: guestpass_act3_ch20_reward_baesan_pressing_strike_recorded}
    quest_clue: {id: guestpass_act3_ch20_clue_broken_return_waypost_spike, name: 부서진 귀로 이정표 촉, type: investigation_clue, concept: 전투 중 드러난 옛 이정표의 금속촉으로 다음 이동지 방향과 파괴 당시 충격을 함께 가리키는 단서, selected_flag: guestpass_act3_ch20_clue_broken_return_waypost_spike_selected, recorded_flag: guestpass_act3_ch20_clue_broken_return_waypost_spike_recorded}
    flags:
      always: [baesan_nonlethal_combat_engaged, one_eye_mountain_bearer_survival_preserved, guestpass_one_eye_mountain_bearer_passage_resolved]
      success: [guestpass_broken_waypost_spike_recovered, baesan_path_opened_without_harm]
      failure: [baesan_protects_name_stones_in_combat_seen, baesan_nonlethal_retreat_recorded]
relationship_directions:
  people: {seo_harin: agency_as_co_witness_and_safety_partner, one_eye_mountain_bearer: survival_and_guardianship_respected, protagonist: modern_name_and_work_role_reframed}
  factions: {guestpass_network: hospitality_and_names_carried_forward, qingliu: values_applied_on_road, bloodmoon_cult: destroyed_physical_marks_only_no_present_actor}
rewards:
  - {id: guestpass_act3_ch20_reward_one_meal_beyond_gate, name: 산문 밖의 한 끼, type: authored_insight, concept: 선택 경로의 고유 보상; runtime effect deferred}
  - {id: guestpass_act3_ch20_reward_baesan_pressing_strike, name: 죽이지 않고 건넌 길, type: authored_insight, concept: 상대를 적으로 고정하지 않고 통과 규칙과 생존을 함께 보존한 기록}
quest_clues:
  - {name: 다음 이동지의 이름과 산길 물리 흔적, type: main_quest_clue, concept: 패찰·발자국·통과명·이정표 촉 중 한 종류로 남는 제한적 이동 방향; 전체 경로는 아님}
flags:
  always: [guestpass_one_eye_mountain_bearer_passage_resolved, one_eye_mountain_bearer_survival_preserved, guestpass_next_destination_trace_opened, guestpass_name_preservation_theme_reinforced, limited_fantasy_vision_only, sado_not_present]
  success: [guestpass_route_to_next_movement_trace_opened, guestpass_baesan_passage_closed]
  failure: [guestpass_route_to_next_movement_trace_opened, guestpass_baesan_cost_recorded]
  follow_up: [guestpass_next_destination_partial_only, guestpass_broken_relay_full_route_unknown, no_killing_solution_used]
local_closure: 외안배산귀는 살아 있는 채 돌 아래 이름을 다시 눌러 두고 길목의 대치를 멈춘다. 주인공과 서하린은 얻은 패찰·탁본·돌조각·이정표 촉 하나만 챙겨 산길을 벗어나며, 제한적 환상은 더 이상 이어지지 않는다.
interlude_safe_state: 며칠 동안 산문 밖에서 식사와 수면, 장비 수선, 패찰 판독, 서하린과 역할 이름의 기한을 확인하는 시간이 가능하다. 배산귀를 다시 자극하거나 즉시 추적전을 시작하지 않는다.
low_pressure_hook: 다음 이동 흔적을 바로 쫓기보다 패찰의 이름을 익명으로 기록할지, 산길의 흙과 발자국을 비교할지, 배산귀와 나눈 책임의 끝을 서하린과 합의할지 고를 수 있다.
next_reentry_trigger: 안전한 휴식과 증거 정리가 끝나고 다음 이동 흔적을 확인할 준비가 되면 guestpass_route_to_next_movement_trace_opened가 wuxia_route_return_scent_clue 재진입을 연다.
cadence_audit:
  time: several_days_after_qingliu_seizure_closure_afternoon_to_evening
  place: collapsed_guestpass_relay_and_baesan_pass
  companions: protagonist_seoharin_one_eye_mountain_bearer
  injury: nonlethal_exertion_only; seoharin_and_baesan_survive; recovery_interlude_available
