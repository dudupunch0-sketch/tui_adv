  - {name: 애도 뒤에 놓인 수선표, type: authored_quest_hook, concept: 즉시 이동보다 기록 보관·애도·청류문 수선을 계획하는 후속 표식}
quest_clues:
  - {name: 최초 소유자의 반쪽 방향, type: main_quest_clue, concept: 두 흔적과 이름을 대조해 얻은 부분 방향; 전체망·정확한 목적지·천기록 해답 없음}
  - {name: 파괴 표식의 남은 획과 이름 없는 빈칸, type: investigation_clue, concept: 다음 확인 질문; 즉시 여행이나 추적을 열지 않음}
