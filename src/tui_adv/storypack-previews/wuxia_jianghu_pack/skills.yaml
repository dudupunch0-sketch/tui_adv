skills:
  - id: wuxia_skill_match_the_pulse
    name: 심박 맞추기
    concept: 호흡이 무너질 때 심장 박동을 다시 몸의 리듬에 맞추는 현대식 자기 관찰.
    rarity: 보통
    category: 사이드
    reveal_immediate: true
  - id: wuxia_skill_fallen_leaf_flow_step
    name: 낙엽 회류보
    concept: 직선으로 맞서지 않고 한 걸음 비껴 흐르는 청류문의 보법.
    rarity: 희귀
    category: 사이드
    reveal_immediate: true
  - id: wuxia_skill_record_the_gap
    name: 빈틈 기록
    concept: 상대의 움직임을 머릿속이 아니라 기록으로 남겨 다음 시도에 쓰는 습관.
    rarity: 희귀
    category: 사이드
    reveal_immediate: true
  - id: wuxia_skill_turning_blade
    name: 돌아보는 칼끝
    concept: 한 번 물러난 칼끝이 상대의 다음 발을 기다렸다가 돌아오는 반격.
    rarity: 희귀
    category: 사이드
    reveal_immediate: true
  - id: wuxia_skill_guard_the_threshold
    name: 문지방 지키기
    concept: 문밖으로 나갈 수 없는 밤에도 누군가의 자리를 지키는 기술.
    rarity: 희귀
    category: 메인
    reveal_immediate: true
  - id: wuxia_skill_two_steps_back
    name: 두 걸음 물러서기
    concept: 싸움에서 이기기 위해 먼저 거리를 포기하는 실전 감각.
    rarity: 보통
    category: 랜덤
    reveal_immediate: true
  - id: wuxia_skill_cut_the_presence
    name: 기척 끊기
    concept: 산길의 풀잎과 숨소리 사이에 자신을 섞는 정통 은신 기술.
    rarity: 보통
    category: 랜덤
    reveal_immediate: true
