reentry_recap: 4/27에 원장부의 위치·보관자·대조 경로를 확인했지만, 원장부를 손에 넣지는 않았다. 흑사방 보스는 그 경로를 이용해 사람을 데려온 값, 머물게 한 환대, 치료비를 하나의 빚으로 묶어 거래하자고 기다린다.
stable_opening: 다음 날 늦은 오전, 주인공은 현대 출근복과 사원증을 숨기지 않은 채 흑사방의 작은 거래방에 들어선다. 서하린은 손목을 받친 채 문 옆에 앉고, 보스는 차와 약값 영수선, 사람의 이름을 같은 탁자에 올린다.
local_urgent_conflict: 보스는 환대와 치료를 베푼 일을 채무로 바꾸고, 그 채무를 대신 질 사람·내역을 들여다볼 사람·거절할 사람을 고르라고 압박한다. 거래는 방 안에서 끝내며, 협상 실패는 관계·정보·기록 일부의 손실일 뿐 탈출 불가나 즉시 전투가 아니다.
beats_and_dialogue:
  - {beat: 같은 탁자의 세 가격, scene: 보스가 숙박한 밤 수·받은 식사·서하린의 치료 약재를 각각 숫자로 적고 한 장의 빚으로 묶는다., dialogue: '흑사방 보스: “사람을 숨긴 밤도, 내어 준 밥도, 붙여 준 약도 공짜가 아니오. 은혜를 계산하면 거래가 되지.”'}
  - {beat: 사원증은 담보가 아니다, scene: 주인공은 사원증을 꺼내 보이되 맡기지 않고 출근복 주머니에 다시 넣는다. 보스의 하인은 낯선 물건도 환대의 값으로 세려 한다., dialogue: '주인공: “이건 제가 누구인지 보여 주는 표식이지, 당신 장부에 사람을 더하는 담보가 아닙니다.”'}
  - {beat: 서하린의 치료비, scene: 서하린은 자신이 받은 치료를 빚으로 인정할지 직접 말하고, 자신의 이름을 대신 담보로 내놓지 않을 선을 정한다., dialogue: '서하린: “치료받았다는 사실과 제가 누구에게 복종한다는 건 달라요. 제 이름으로 새 채무를 만들지 마세요.”'}
  - {beat: 보스의 환대 논리, scene: 보스는 청류문과 객패를 보호한 대가라며 사람의 이동과 다음 도움을 함께 요구한다. 빚의 내역에는 원장부 대조 경로가 압박 카드로 끼워져 있다., dialogue: '흑사방 보스: “길을 알려 준 손님은 길값을 갚아야 하오. 원장부로 가는 길도 그 값에 포함되지.”'}
  - {beat: 네 가지 대응표, scene: 대신 빚을 지기·내역 조사·거절·조건을 분리해 증인과 확인하기를 각각 다른 위험과 기록으로 나눈다., dialogue: '주인공: “사람의 값, 머문 값, 약값을 한 줄로 서명하지 않겠습니다. 무엇을 거래하는지 먼저 나누죠.”'}
  - {beat: 장내의 마지막 압박, scene: 보스가 서하린의 침묵과 주인공의 사원증을 각각 동의로 해석하려 하지만, 서하린은 중단 여부를 직접 말하고 객잔 증인은 말의 순서를 적는다., dialogue: '서하린: “침묵은 동의가 아니에요. 오늘 거래가 끝나도, 제 선택을 당신 장부의 빈칸으로 쓰지 못합니다.”'}
  - {beat: 거래의 종결, scene: 선택 결과에 따라 채무표·조사 메모·거절 영수선·증인 대조표 중 하나를 봉인한다. 보스는 물러나지만 다음 원장부 지연책의 가능성만 남는다., dialogue: '흑사방 보스: “좋소. 오늘의 대답은 받았소. 다만 길을 늦추는 손도 거래의 일부라는 걸 기억하시오.”'}
