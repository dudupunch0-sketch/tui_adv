contract_id: combat_intervention_response
status: canonical
effective_date: '2026-08-08'
runtime_status: handoff_required
schemas:
  canonical_contract: schema/combat_intervention.schema.json
  authoring_payload: schema/combat_intervention_response.schema.json
  roles:
    canonical_contract: validates_this_entire_yaml_document
    authoring_payload: validates_each_authored_response_payload_only
owners:
  response_resolution: combat_core
  atomic_application: combat_intervention_transaction
  authoring_validation: design_validator
  presentation: renderer

canonical_semantics:
  selected_target:
    cardinality: exactly_one
    binding: immutable_bound_target_from_pause_opportunity_provenance
    accepted_when:
      - active_at_pause_snapshot
      - active_at_triggering_tick_start_and_ko_during_that_same_tick
    rejected_when: [previously_ko, fled, departed, captured]
    departed_meaning: non_flee_departure
    provenance_fields: [bound_target_ids, bound_target_tick, bound_target_state_at_tick_start, trigger_tick]
    resolution: no_re_evaluation_against_later_state_within_atomic_transaction
  executor:
    observer:
      opportunity_observer: exact
      requires: [can_act, required_capabilities]
      mapping: exactly_one_active_combatant_with_hp_greater_than_zero
      otherwise: preflight_error
    any_capable:
      candidates: all_pause_snapshot_observers_satisfying_can_act_and_required_capabilities
      candidate_mapping: exactly_one_active_combatant_with_hp_greater_than_zero_per_candidate
      selection: stable_combatant_id_ascending_first
      zero_candidates: preflight_error
      ordering_source: stable_combatant_id_not_vector_or_insertion_order
  effect_target_compatibility:
    source_registry: pause_snapshot_bound_CombatEffectCatalog.effects
    branches: [success, failure]
    effect_ids: all_authored_effect_ids_in_both_branches
    unknown_effect_id: preflight_error
    definition_target_selector: canonical_target_selector_id_required
    compatibility_rule: effect_target_selector_exactly_matches_response_special_effect_target_selector_id
    validate_before_rng: [success_branch, failure_branch]
    incompatibility: preflight_error
    rejection_mutations: {state: 0, cost: 0, rng: 0, history: 0}
    static_authoring_validator_without_catalog: do_not_guess_combinations
    runtime_preflight: mandatory_machine_contract
  multi_target:
    resolved_target_ids: stable_combatant_id_ascending
    authored_effect_ids: unique_and_authored_order_is_semantic
    application_order: effect-major, then target stable ascending
    exactly_once_per_effect_target_pair: true
    atomic_rejection: {state_mutations: 0, cost_mutations: 0, rng_draws: 0}
  lowest_health:
    population: active_same_side_combatants_including_executor
    required_snapshot_invariant: every_candidate_max_hp_greater_than_zero
    invalid_snapshot: corrupted_snapshot_preflight_error
    comparison: integer_rational_cross_multiplication_no_float
    tie_break: stable_combatant_id_ascending
  surrounded:
    neighborhood: six_adjacent_hexes_intersecting_candidate_anchor
    counts: distinct_occupied_hexes_not_combatants
    ally_count: exclude_entire_candidate_footprint
    active_footprints_only: true
  strategy_scope:
    allowed: [combatants, role, all_allies]
    all_allies_resolution: executor_side_all_allies_side_overlay
    unsupported_authoring_scope: side
    precedence: [combatant, role, all_allies_side, baseline]
  formula_fingerprint:
    semantic_tag: combat.formula.v1.fixed_chance
    namespace: actual_combat
    tuple_prefix: [combat.formula.v1.fixed_chance, actual_combat]
    encoding: utf_8_compact_canonical_json_array
    object_keys: BTreeMap_lexicographic
    hash: FNV-1a_64
    input_fingerprint: lowercase_16_hex_of_fnv_result
    sub_seed: same_64_bit_fnv_result
    draw_zero_roll: sub_seed_mod_100
    deterministic_0_or_100: fingerprint_and_sub_seed_derived_but_no_draw_or_roll
    algorithm_change: simulation_version_bump_required
  registry_membership: unknown_ids_are_preflight_or_validator_errors
  outcome_resolution:
    action_source_selectors: resolve_in_pause_preflight_and_record_provenance
    target_ordering: deterministic

response_payload:
  optional_fields: [strategy_modifier, special_effect]
  minimum_present: 1
  derived_kinds: [effect_only, strategy_only, both]
  derived_from_payload_presence: true
  forbidden_fields: [intervention_kind, resolution_kind, hybrid_kind]
  composite_strategy_applies_on: [special_effect_success, special_effect_failure]
  preflight_error_result: reject_entire_response_transaction
  special_effect_failure_is_outcome: true

transaction:
  boundary: one_pause_before_next_tick
  input_snapshot: pause_snapshot
  resolve_before_mutation: [executor, targets, strategy_scope, formula_inputs]
  phases:
    - preflight_validate
    - resolve_selectors_and_formula_inputs
    - evaluate_special_effect
    - plan_strategy_and_outcome_actions
    - atomic_commit
    - write_decision_receipt
    - derive_next_segment_seed
  validation_failure:
    failure_class: authoring_or_input_preflight_error
    rollback_scope: entire_response_transaction
    state_changes: 0
    cost_changes: 0
    rng_draws: 0
    history_changes: 0
    pause: retained
    receipt: none
  outcome_failure:
    failure_class: resolved_special_effect_outcome
    strategy_modifier: applied
    outcome_actions: failure_branch_only
  checkpoint_states: [pre_transaction, post_transaction]
  partial_apply_serialization: forbidden
  delayed_or_multi_tick_workflow: forbidden
  rng_draws:
    strategy_only: 0
    deterministic_special_effect: 0
    probabilistic_special_effect: 1
  probabilistic_rng:
    namespace: actual_combat
    source: deterministic_sub_seed
    provenance_required: true
    canonical_sub_seed_inputs:
      - formula_semantic_tag
      - rng_namespace
      - effective_segment_seed
      - simulation_version
      - manifest_fingerprint
      - segment_index
      - pause_tick
      - pause_id
      - evaluation_fingerprint
      - authored_response_id
      - formula_id
      - normalized_formula_parameters
      - resolved_executor_id
      - canonical_ordered_target_ids
    canonical_encoding:
      input: ordered_tuple_in_declared_input_order
      serialization: utf_8_canonical_json_array
      whitespace: none
      object_key_order: lexicographic
      integer_encoding: decimal
      normalized_formula_parameters_key_order: lexicographic
      sub_seed_derivation_hash: fnv_1a_64_current_v3
      input_fingerprint: lowercase_16_hex_of_fnv_result
      sub_seed: same_64_bit_fnv_result
      draw_zero_roll: sub_seed_mod_100
    draw_index: 0
    forbidden_inputs: [wall_clock, frame, renderer, forecast]

registry:
  selector_version: v1
  formula_version: v1
  strategy_targeting_version: v1
  canonical_only_runtime: true
  unknown_id: validator_error
  legacy_policy: migration_only
  legacy_aliases: [self, target, observer, opponent, any]
  tie_break: stable_combatant_id_ascending
  response_selector_resolution: once_from_pause_snapshot
  dynamic_strategy_targeting: reevaluate_each_tick_from_canonical_snapshot
  opportunity_provenance:
    required_fields: [bound_target_ids, bound_target_tick, bound_target_state_at_tick_start, trigger_tick]
    bound_target_ids: immutable_single_bound_target_ids_or_empty
    source: pause_snapshot
  selector_definitions:
    executor_self:
      resolves: executor_combatant_exactly_one
    selected_target:
      resolves: exactly_one_immutable_bound_target; active_at_pause_or_active_at_trigger_tick_start_then_ko_same_tick_only
      ai_current_target_fallback: forbidden
    nearest_active_enemy:
      candidate_set: active_enemy_combatants_opposite_side
      ordering: minimum_occupied_footprint_hex_distance_between_executor_and_candidate_ascending_then_stable_id
    lowest_health_active_ally:
      candidate_set: active_same_side_combatants_including_executor
      ordering: exact_integer_rational_cross_multiplication_current_hp_over_max_hp_ascending_then_stable_id
    surrounded_active_ally:
      candidate_set: active_same_side_combatants_including_executor
      neighborhood: six_adjacent_hexes
      predicate: distinct_enemy_occupied_hexes_at_least_3_and_distinct_ally_occupied_hexes_zero
      candidate_self_occupancy: entire_candidate_footprint_excluded_from_ally_occupancy_count
      exclusions: [ko, departed, captured]
      ordering: enemy_count_descending_then_stable_id
      terrain_and_boundary_inputs: excluded
    all_active_allies:
      candidate_set: active_same_side_combatants_including_executor
      ordering: stable_id_ascending
      multi_target: true
    multi_target_selector_ids: [combat.selector.target.v1.all_active_allies]
    zero_target_result: preflight_error
  formula_definitions:
    combat.formula.v1.fixed_chance:
      parameters:
        required: [chance_percent]
        properties: [chance_percent]
        type: object
        additional_properties: false
        chance_percent: {type: integer, minimum: 0, maximum: 100}
      authored_inputs_only: true
      modifiers: forbidden
      rounding: forbidden
      clamp: forbidden
      roll: integer_range_0_99
      success: roll_less_than_chance_percent
      rng_draws: {zero_percent: 0, one_to_ninety_nine_percent: 1, one_hundred_percent: 0}
      deterministic_outcomes: {zero_percent: failure, one_hundred_percent: success}
      deterministic_receipt_rng_fields:
        rng_namespace: actual_combat
        rng_draw_index: null
        roll: null
  selector_ids:
    executor:
      - combat.selector.executor.v1.observer
      - combat.selector.executor.v1.any_capable
    target:
      - combat.selector.target.v1.executor_self
      - combat.selector.target.v1.selected_target
      - combat.selector.target.v1.nearest_active_enemy
      - combat.selector.target.v1.lowest_health_active_ally
      - combat.selector.target.v1.surrounded_active_ally
      - combat.selector.target.v1.all_active_allies
  formula_ids:
    - combat.formula.v1.fixed_chance
  strategy_targeting_rule_ids:
    - combat.strategy.targeting.v1.attackers_of
    - combat.strategy.targeting.v1.rearmost_active_enemy
    - combat.strategy.targeting.v1.focus_resolved_target
  version_relationship:
    registry_versions_independent_from_simulation_version: true
    same_id_semantic_change: forbidden
    global_judgement_change_requires_simulation_version_bump: true

legacy_migration:
  boundary: offline_or_load_time_migration_only
  canonical_runtime_authoring: reject_legacy_fields_and_aliases
  legacy_fields: [resolution_kind, executor_selector, target_selector]
  resolution_kind_mapping:
    effect: special_effect_only_if_formula_and_effect_branches_are_recoverable
    choice: designer_review_required
    unknown: designer_review_required
  selector_alias_mapping:
    observer: combat.selector.executor.v1.observer_only_in_executor_selector
    self: combat.selector.target.v1.executor_self_only_in_target_selector
    target: selected_target_only_if_single_bound_target_is_proven_else_designer_review_required
    opponent: designer_review_required
    any: designer_review_required
  ambiguous_alias_result: designer_review_required
  automatic_ambiguous_conversion: forbidden
  preserve_original_fields_in: migration_provenance
  legacy_v1_selection_result: legacy_no_effect
  retroactive_reward_or_effect: forbidden

special_effect:
  required_fields: [formula_id, formula_parameters, executor_selector_id, target_selector_id, success, failure]
  outcome_branches: [success, failure]
  branch_fields: [effect_ids, outcome_actions]
  outcome_action_kinds: [set_flag, create_loot_entitlement, grant_item]
  outcome_action_fields:
    authored_common: [kind]
    set_flag: [flag_id]
    create_loot_entitlement: [item_id, source_selector_id, claim_policy]
    grant_item: [item_id]
  action_plan_owner: combat_core
  application_owner: combat_intervention_transaction
  exactly_once:
    id_generation_owner:
      action_id: combat_core
      entitlement_id: combat_core
      response_application_transaction_id: gamecore
      claim_action_id: gamecore
      claim_application_transaction_id: gamecore
    deterministic_inputs:
      action_id: [decision_receipt_fingerprint, outcome_branch, action_index]
      entitlement_id: [action_id]
      response_application_transaction_id: [pause_id, decision_receipt_fingerprint]
      claim_action_id: [entitlement_id, terminal_facts_fingerprint]
      claim_application_transaction_id: [combat_id, terminal_facts_fingerprint]
    ledgers:
      response_actions: GameState.combat_intervention_ledger.applied_action_ids
      committed_response_results: GameState.combat_intervention_ledger.committed_response_results_by_transaction_id
      applied_action_ids: GameState.combat_intervention_ledger.applied_action_ids
      entitlements: GameState.combat_intervention_ledger.unresolved_loot_entitlements_by_id
      claims: GameState.combat_intervention_ledger.loot_claim_receipts_by_action_id
      applied_claim_action_ids: GameState.combat_intervention_ledger.applied_claim_action_ids
    retry:
      response_action: matching_action_id_returns_already_applied_without_mutation
      entitlement_creation: matching_entitlement_id_returns_existing_entitlement
      entitlement_claim: matching_claim_action_id_returns_already_applied_without_mutation
    transaction_separation:
      response_application: response_application_transaction_id
      terminal_loot_claim: claim_application_transaction_id
      same_transaction_id: forbidden
  direct_grant:
    timing: immediate_atomic_commit
    inventory_result: acquired
  loot_entitlement:
    timing: create_on_outcome_claim_on_terminal
    default_claimable_results: [victory, objective]
    default_denied_results: [escape, defeat, surrender, capture, forced_stop]
    default_denied_reasons: [both_sides_defeated]
    explicit_override: allowed

strategy_modifier:
  baseline: immutable
  scopes: [all_allies, role, combatants]
  operations: [set_role_weight, set_targeting_rule, set_target_policy, clear_override]
  durations: [until_replaced, next_segment]
  default_duration: until_replaced
  combat_end: discard_all_overlays
  stacking:
    same_scope_and_field: latest_replaces
    disjoint_fields: coexist
    additive_numeric: forbidden
    arbitrary_json_patch: forbidden
  precedence: [combatant, role, all_allies_side, baseline]
  unsupported_authoring_scope: side
  clear_override_result: restore_baseline
  invalid_target:
    first: canonical_fallback
    otherwise: baseline_targeting
  special_effect_outcome_dependency: none

lifecycle:
  states: [running, paused_for_intervention, terminal]
  terminal_reason_separate: true
  terminal_result_separate: true
  pause_is_termination_candidate: false
  pause_required_fields: [pause_id, tick, segment_index, evaluation_fingerprint, allowed_response_ids]
  stable_pause_id: required
  stale_response_match: [pause_id, evaluation_fingerprint, state_revision]
  stale_response: reject
  nested_pause: forbidden
  host_timeout: submit_no_intervention
  forced_stop:
    overrides_pause: true
    invalidates_pause_id: true
    terminal_priority: 10
  ko_tick_order:
    - apply_tick_results
    - collect_provisional_terminal_facts
    - detect_intervention
    - apply_intervention
    - recompute_terminal_facts
    - settle_terminal

checkpoint_and_receipt:
  storage_model: resolved_decision_receipt_plus_compact_state_snapshot
  save_schema_version: 2
  combat_checkpoint_schema_version: 2
  decision_receipt_schema_version: 1
  receipt_required_fields:
    - receipt_id
    - pause_id
    - evaluation_fingerprint
    - application_transaction_id
    - authored_response_id
    - canonical_registry_ids
    - resolved_executor_id
    - resolved_target_ids
    - resolved_strategy_scope_ids
    - strategy_before_fingerprint
    - strategy_after_fingerprint
    - effect_ids
    - outcome_actions
    - action_receipts
    - lifecycle_before
    - lifecycle_after
    - terminal_facts
    - raw_log_references
  formula_receipt_fields:
    - formula_id
    - normalized_formula_parameters
    - input_fingerprint
    - rng_namespace
    - rng_draw_index
    - roll
    - outcome
  receipt_optional_fields: [formula_receipt]
  formula_receipt_rules:
    strategy_only: absent
    special_effect_present: required
    deterministic_zero_or_one_hundred:
      rng_namespace: actual_combat
      rng_draw_index: null
      roll: null
    probabilistic_one_to_ninety_nine:
      rng_namespace: actual_combat
      rng_draw_index: 0
      roll: integer_range_0_99
  action_receipt_statuses: [applied, already_applied, pending_claim, rejected]
  compact_snapshot_fields:
    - lifecycle
    - active_pause
    - combatant_state
    - active_effects
    - active_strategy_overlays
    - unresolved_loot_entitlements
    - applied_action_ids
    - applied_claim_action_ids
    - application_transaction_ids
    - claim_application_transaction_ids
    - current_segment_seed
    - raw_log_cursor
  fingerprints: [intent_fingerprint, decision_receipt_fingerprint, checkpoint_fingerprint]
  next_segment_seed_input: decision_receipt_fingerprint
  raw_log_policy:
    storage: immutable_ordered_stream
    receipt_reference_fields: [sequence_start, sequence_end, raw_log_fingerprint]
    duplicate_raw_events_in_receipt: forbidden
  legacy_v1:
    selection_status: legacy_no_effect
    preserve_original_intent: true
    retroactive_effect_application: forbidden
    unsupported_simulation_version: explicit_migration_or_reject
  terminal_receipt_schema_version: 1
  terminal_receipt_required_fields:
    - terminal_receipt_id
    - combat_id
    - terminal_facts_fingerprint
    - claim_application_transaction_id
    - loot_claim_receipts
    - raw_log_references

provenance_and_logs:
  receipt_raw_event_policy: references_only_no_event_duplication
  receipt_entity_references: canonical_entity_ids_only
  receipt_zone_references: canonical_zone_ids_or_selector_provenance
  display_labels_in_receipt: forbidden
  render_time_label_resolution: [combat_display_identity, combat_tactical_zones]
  hidden_state_capture: only_formula_inputs_and_fingerprints_required_for_replay
  internal_id_user_visible: forbidden
  raw_event_contract: combat_log_presentation
  raw_event_types:
    decision: intervention_decision_committed
    strategy: strategy_overlay_applied
    effect: special_effect_resolved
    action: outcome_action_applied
    entitlement: loot_entitlement_created
    claim: loot_claim_resolved
  renderer_aggregation: non_groupable_preserve_sequence_and_receipt_reference

runtime_handoff:
  current_runtime_simulation_version: v3
  implementation_complete: false
  required_work_packages:
    - response_schema_and_registry
    - atomic_response_transaction
    - strategy_overlay_runtime
    - typed_outcome_action_application
    - lifecycle_and_terminal_integration
    - receipt_and_checkpoint_v2
    - renderer_consumer_boundary

i7_contract:
  decision_status: all_open_questions_closed
  scope: response_transaction_and_durable_exactly_once_ledger
  owner_modules:
    response_plan:
      existing_owner_module: crates/escape-core/src/combat_runtime.rs
      owner_boundary: combat_core_resolves_pause_snapshot_and_builds_typed_plan
    atomic_mutation:
      module: crates/escape-core/src/combat_intervention_transaction.rs
      status: new_required_module
      owner_boundary: GameCore_atomic_candidate_state_commit_and_swap
    entry_boundary:
      existing_owner_module: crates/escape-core/src/lib.rs
      owner_boundary: public_export_and_entry_facade_only
    persistence_boundary:
      existing_owner_module: crates/escape-core/src/save.rs
      owner_boundary: SaveEnvelope_load_save_and_version_gate
  dto_contract:
    input:
      name: CombatInterventionResponseInput
      status: new_required_type
      owner: gamecore_api_boundary
      fields: [pause_id, evaluation_fingerprint, authored_response_id, payload]
    plan:
      name: CombatInterventionResponsePlan
      status: new_required_type
      owner: combat_core
      fields: [response_application_transaction_id, pause_id, evaluation_fingerprint, precondition_game_state_fingerprint, resolved_executor_id, resolved_target_ids, resolved_outcome, strategy_overlay_plan, effect_application_plan, outcome_action_plan, formula_receipt, decision_receipt_draft, deterministic_next_segment_seed, provenance]
    output:
      name: CombatInterventionCommitResult
      status: new_required_type
      owner: gamecore
      fields: [status, decision_receipt, action_receipts, next_segment_seed]
    claim_output:
      name: CombatLootClaimResult
      status: new_required_type
      owner: gamecore
      fields: [status, claim_receipt, inventory_delta]
    entitlement:
      name: CombatLootEntitlement
      status: new_required_type
      owner: gamecore
      fields: [entitlement_id, item_id, source_ids, source_provenance, claim_policy, origin_combat_id, origin_pause_id, origin_decision_receipt_fingerprint, status]
    claim_input:
      name: CombatLootClaimInput
      status: new_required_type
      owner: gamecore
      fields: [entitlement_id, terminal_facts_fingerprint]
  plan_boundary:
    input_only_plan_fields: [decision_receipt_draft]
    candidate_use: finalize_decision_receipt_before_swap
    never_persisted_to: [GameState.combat_intervention_ledger, SaveEnvelope.combat_checkpoint]
    durable_replacement: decision_receipt
  action_semantics:
    set_flag: idempotent_set_existing_or_new_flag
    grant_item: exact_once_direct_inventory_grant
    create_loot_entitlement: create_unclaimed_entitlement_without_inventory_mutation
    action_plan_owner: combat_core
    atomic_commit_owner: combat_intervention_transaction
    fully_resolved_plan: GameCore_transaction_consumes_plan_without_selector_formula_branch_or_target_re_evaluation
    stale_precondition: precondition_game_state_fingerprint_mismatch_rejected_before_candidate_swap
  receipt_timing:
    preflight_receipt:
      status: transient_active_combat_session_only
      timing: immediately_after_successful_preflight_before_gamestate_mutation
      failure: no_receipt_no_history_no_state_cost_or_rng_mutation_pause_retained
    resolved_decision_receipt:
      status: durable_after_successful_atomic_commit
      timing: finalized_with_action_receipts_and_cached_commit_result_in_candidate_before_swap_becomes_durable_with_atomic_swap_before_next_segment_continuation
      contains: [resolved_ids, provenance, formula_receipt, action_receipts, lifecycle_transition]
  durable_state:
    ledger:
      name: CombatInterventionLedger
      status: new_required_type
      location: GameState.combat_intervention_ledger
      fields: [committed_response_results_by_transaction_id, applied_action_ids, unresolved_loot_entitlements_by_id, loot_claim_receipts_by_action_id, applied_claim_action_ids]
    cross_session_durable: GameState.combat_intervention_ledger
    active_session_checkpoint: SaveEnvelope.combat_checkpoint
    transient_session_only: [transaction_scratch, partial_working_copy, renderer_state]
    checkpoint_serialization: allowed_for_paused_session_restart
    checkpoint_disposal: terminal_or_forced_stop_discarded_and_never_promoted_to_ledger
    forbidden_serialized_fields: [transaction_scratch, partial_working_copy, renderer_state]
    ledgers:
      committed_responses: committed_response_results_by_transaction_id
      response_actions: applied_action_ids
      unresolved_entitlements: unresolved_loot_entitlements_by_id
      claims: loot_claim_receipts_by_action_id
      claim_idempotency: applied_claim_action_ids
  save_version_boundary:
    observed_current_save_schema_version: 1
    observed_current_save_type: SaveEnvelope
    i7b_target_save_schema_version: 2
    bump_only_when: durable_i7_ledger_fields_are_added
    v1_backward_load: missing_combat_intervention_ledger_defaults_to_empty_CombatInterventionLedger
    v1_selection_history: preserve_as_legacy_no_effect
    migration_boundary: load_time_only
    migration_scaffolding: only_empty_defaults_and_one_version_gate
    combat_checkpoint: SaveEnvelope_optional_CombatRuntimeCheckpoint_is_active_session_scoped_and_serializable
    checkpoint_schema_version_current: 1
    checkpoint_schema_version_i2b_i7a_target: 2
    checkpoint_v1_provenance_missing: explicit_reject
  transaction_statuses:
    applied: atomic_commit_completed_and_action_effect_is_present
    already_applied: matching_id_found_and_no_mutation_performed
