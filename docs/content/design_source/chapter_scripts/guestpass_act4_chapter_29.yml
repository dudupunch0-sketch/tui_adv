reentry_recap: 흑사방 두목과의 흥정은 끝났지만 객패 이동 기록이 실시간 추적에 노출될 위험이 남았다. 서하린은 기록을 없애지 않고 도착 시각을 늦추는 계략을 제안한다.
stable_opening: 낮, 주인공은 현대 몸 그대로 출근복과 사원증을 갖춘 채 장부 탁자에 앉는다. 서하린은 손목을 쉬게 하면서 감시자가 보는 낮 기록과 밤의 보호 기록을 직접 나눈다.
local_urgent_conflict: 기록을 지우면 사람이 사라지고, 그대로 넘기면 이동자가 팔린다. 지연·암호·미끼·이중 원본 중 하나를 정하되 즉시 전투나 고정 카운트다운은 없다.
beats_and_dialogue:
  - {beat: 낮의 장부, scene: 서하린이 감시자 앞에서 사실에 맞는 객패 이동 기록을 쓰고 공개본과 보호본의 경계를 표시한다., dialogue: '서하린: “기록을 없애면 사람도 사라져요. 남기되, 늦게 도착하게 만들어요.”'}
  - {beat: 회사에서 가져온 감각, scene: 주인공은 출근복 소매로 번진 먹물을 닦고 사원증 뒷면에 승인자와 전달 시각을 따로 적는다., dialogue: '주인공: “회사에서는 버전과 결재선을 나눴습니다. 여기서도 누가 언제 원본을 봤는지는 분리할 수 있어요.”'}
  - {beat: 밤의 빈칸, scene: 두 사람은 이름·이동 순서·전달 시간을 지우지 않고 시간차와 매듭 규칙으로 늦춰 읽히게 만든다., dialogue: '서하린: “빈칸은 삭제가 아니에요. 위험이 지나갈 때까지 묶어 두는 자리예요.”'}
  - {beat: 네 갈래 책임, scene: 순서 변경·매듭 암호·미끼 장부·이중 원본을 탁자에 놓고 서하린이 선택과 중단 권한을 주인공과 나눈다., dialogue: '서하린: “제가 혼자 희생하는 계략은 만들지 않겠어요. 무엇을 남길지 같이 정해요.”'}
  - {beat: 사도의 계산 흔적, scene: 흑사방 감시자의 대조용 납인과 장부의 시차를 맞춰 사도가 불일치를 사람의 가격으로 환산한다는 패턴을 확인한다., dialogue: '흑사방 감시자: “늦어진 시간만큼 누군가는 값을 치르지.”'}
  - {beat: 장내 결산, scene: 선택한 기록을 봉인하고 식사·손목 휴식·다음 확인 날짜를 남긴다., dialogue: '주인공: “오늘 확보한 건 거짓말이 아니라, 사람이 먼저 도착할 시간입니다.”'}
