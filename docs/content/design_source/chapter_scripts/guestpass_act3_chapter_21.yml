reentry_recap: 객패의 다음 이동 흔적이 열렸지만 목적지는 비어 있다. 주인공은 현대 몸과 출근복, 사원증을 그대로 지닌 채 낯익은 냄새를 맡았고, 그 감각이 귀환을 증명하기보다 잃어버린 일상을 건드렸다.
stable_opening: 비가 그친 오후, 객잔의 젖은 나무와 출근복 소매의 세제 냄새가 겹친다. 서하린은 사원증을 만지는 주인공을 보고도 대신 해석하지 않는다. 오늘은 감정이 흔들린 방을 정리하는 일이다.
local_urgent_conflict: 익숙한 냄새와 현대 물건의 잔상이 장내를 불안하게 한다. 기록·탐색·회피 중 하나로 감정을 정리하되 즉시 귀환이나 포털을 만들지 않는다.
beats_and_dialogue:
  - {beat: 젖은 소매의 냄새, scene: 객잔 주인이 낯선 세제 냄새를 묻고 주인공은 출근복 소매를 확인한다., dialogue: '객잔 주인: “이 고을 냄새는 아닌데, 그렇다고 길이 열린 냄새도 아니오.”'}
  - {beat: 사원증의 모서리, scene: 사원증과 가방끈이 젖은 탁자에 닿고 몸이 집을 찾는 듯한 반응을 보인다., dialogue: '주인공: “이건 증거라기보다 제가 아직 같은 사람이라는 표식에 가깝습니다.”'}
  - {beat: 서하린의 거리, scene: 서하린은 냄새를 단정하지 않고 물을 내온다. 둘은 공동 노동과 증언으로만 상태를 확인한다., dialogue: '서하린: “돌아갈 수 있다는 말은 안 할게요. 지금 여기서 숨을 고를 수 있다는 말은 할 수 있어요.”'}
  - {beat: 객잔 바닥 정리, scene: 흩어진 짐과 젖은 장작을 치우며 감정 동요를 업무 순서로 바꾼다., dialogue: '객잔 주인: “냄새를 쫓기 전에 바닥부터 닦읍시다.”'}
  - {beat: 세 가지 기록법, scene: 냄새의 강도·사라진 물건·몸의 반응을 나누어 적고 남길 기록을 고른다., dialogue: '주인공: “귀환은 결론이 아니라 무엇이 흔들렸는지부터 적는 일일지도 모릅니다.”'}
  - {beat: 저녁의 정상화, scene: 식사와 빨래, 사원증을 말리며 냄새가 약해진다., dialogue: '서하린: “오늘 해결한 건 길이 아니라 방이에요. 그래도 내일 길을 볼 수 있게 됐죠.”'}
