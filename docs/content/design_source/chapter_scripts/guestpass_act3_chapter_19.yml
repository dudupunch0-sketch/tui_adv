      failure: [black_serpent_recovery_order_seen, qingliu_partial_goods_lost]
  - id: assume_part_of_the_debt
    label: 빚 일부를 내 이름으로 떠안는다
    immediate_result: 주인공은 현대식 계약 감각으로 상환 범위와 기한을 직접 적으려 한다. 압류는 멈추지만 이름이 흑사방 채무선에 올라가고 서하린은 혼자 결정한 희생을 경계한다.
    success: 제한부 조항이 인정되어 방과 사람 기록을 보존하고 협상 문서 사본을 얻는다. 빚을 없앴다고 하지 않고 비용 있는 책임으로 남긴다.
    failure: 불리한 조항이 남아 후속 추심 위험이 커지지만 원장부 대조에 필요한 납인 흔적은 확보한다. 서하린과 책임 분담을 다시 합의할 여지를 남긴다.
    relationship_directions:
      people: {cheong_ujin: mixed_respects_commitment_questions_cost, seo_harin: mixed_care_and_disagreement}
      factions: {qingliu: positive_debt_shared_not_erased, black_serpent: coercive_contract_language_exposed}
    reward_candidate: {id: guestpass_act3_ch19_reward_seoharin_empty_room_key, name: 서하린이 맡긴 빈방 열쇠, type: relationship_token, concept: 소유권이 아니라 다시 돌아올 사람의 자리를 잠시 지킬 권한과 책임, selected_flag: guestpass_act3_ch19_reward_seoharin_empty_room_key_selected, recorded_flag: guestpass_act3_ch19_reward_seoharin_empty_room_key_recorded}
    quest_clue: {id: guestpass_act3_ch19_clue_limited_debt_assumption, name: 제한부 채무 인수서, type: quest_item, concept: 방을 지킨 대가와 흑사방의 거래 문법이 동시에 적힌 문서, selected_flag: guestpass_act3_ch19_clue_limited_debt_assumption_selected, recorded_flag: guestpass_act3_ch19_clue_limited_debt_assumption_recorded}
