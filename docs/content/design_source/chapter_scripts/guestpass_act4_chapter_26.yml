    success: 무명의 우세를 인정하면서도 두 걸음의 퇴로를 확보하고, 이름을 요구받아도 자신의 대답 시점을 스스로 정한다.
    failure: 어깨가 밀리고 사원증 끈이 끊어질 뻔하지만 서하린의 중단 신호를 받아 물러나며, 무명이 완전히 제압하지 못했다는 사실은 남는다.
