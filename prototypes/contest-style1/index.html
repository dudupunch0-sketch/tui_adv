<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>캐릭터 리그 스타일 비교 — 2D 본 리그 vs 3D 셀 셰이딩</title>
    <script type="importmap">
      { "imports": { "three": "./node_modules/three/build/three.module.js" } }
    </script>
    <style>
      /* Neutral mid-grey ground: a light or dark page would flatter one of the
         two styles and the comparison would stop being about the characters. */
      :root { --page: #6e747e; --card: #565c66; --text: #f5f7f9; --muted: #d2d7dd; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 26px; background: var(--page); color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 19px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
      .meta { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 20px; }
      .row { margin-bottom: 24px; }
      .strip { display: flex; gap: 12px; flex-wrap: wrap; }
      figure { margin: 0; }
      figcaption { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); margin-top: 5px; text-align: center; }
      canvas { display: block; border-radius: 3px; background: #47505c; }
      #sheet { background: var(--card); padding: 20px; border-radius: 6px; }
      .detail { margin-top: 30px; }
      .note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <div id="sheet">
      <h1>캐릭터 리그 스타일 비교</h1>
      <div class="meta" id="meta">loading…</div>
      <div id="rows"></div>
    </div>
    <div class="detail" id="details"></div>

    <script type="module">
      import * as THREE from 'three';
      import { createRobe, poseFor, signalsFor, stepRobe } from './rig.js';
      import { drawCharacter2D, drawImpact2D } from './rig2d.js';
      import { applyPose3D, buildCharacter3D, createScene3D } from './rig3d.js';

      const SMALL = { w: 300, h: 260 };
      const LARGE = { w: 620, h: 500 };
      const DPR = 2;
      const PHASE = 0.5;

      function fnv1a(text) {
        let h = 0x811c9dc5;
        for (let i = 0; i < text.length; i += 1) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
        return h >>> 0;
      }
      function rngFrom(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const combat = await (await fetch('./combat-frames.json')).json();
      const view = combat.view;
      const TICKS = [
        { index: 0, note: '개전' },
        { index: 3, note: '교전' },
        { index: view.frames.length - 1, note: '결착' },
      ];

      document.getElementById('meta').textContent =
        `실제 ScenePage.combat · sim=${view.simulation_version} · fp=${view.fingerprint} · ` +
        `frames=${view.frames.length} · tick=${view.tick_millis}ms · outcome=${combat.report?.outcome}`;

      /**
       * Robe state is integrated in tick order and cached, so a still at t4
       * carries the cloth motion that the ticks before it produced. Rendering
       * frames out of order would silently change the hem.
       */
      const robeCache = new Map();
      function robesUpTo(targetIndex) {
        if (robeCache.has(targetIndex)) return robeCache.get(targetIndex);
        const robes = new Map();
        for (const piece of view.frames[0].pieces) robes.set(piece.id, createRobe());
        for (let i = 0; i <= targetIndex; i += 1) {
          const frame = view.frames[i];
          const prev = i > 0 ? view.frames[i - 1] : null;
          for (const piece of frame.pieces) {
            const s = signalsFor(piece, frame, prev, view);
            const pose = poseFor(s, PHASE);
            const robe = robes.get(piece.id);
            const sweep = -(s.attack * 1.5 + s.hit * 0.9 + s.closing * 1.2);
            stepRobe(robe, pose.hipX, 50 + pose.hipY, sweep);
          }
        }
        const snapshot = new Map(
          [...robes].map(([k, v]) => [k, { pts: v.pts.map((p) => ({ ...p })), segLen: v.segLen, segments: v.segments }]),
        );
        robeCache.set(targetIndex, snapshot);
        return snapshot;
      }

      function render2D(ctx, W, H, frameIndex) {
        ctx.clearRect(0, 0, W, H);
        const frame = view.frames[frameIndex];
        const prev = frameIndex > 0 ? view.frames[frameIndex - 1] : null;
        const robes = robesUpTo(frameIndex);
        const groundY = H * 0.88;
        const scale = (H * 0.66) / 100;
        const spread = W * 0.23;

        // Ally on the left, enemy on the right, each turned toward the other —
        // the hex board decides the real placement; this framing just makes the
        // exchange legible in a still.
        const order = [...frame.pieces].sort((a) => (a.side === 'ally' ? -1 : 1));
        order.forEach((piece, i) => {
          const s = signalsFor(piece, frame, prev, view);
          s.facing = i === 0 ? 1 : -1;
          const pose = poseFor(s, PHASE);
          const cx = W / 2 + (i === 0 ? -spread : spread);
          drawCharacter2D(ctx, cx, groundY, scale, piece.side, pose, robes.get(piece.id), s, PHASE);
          drawImpact2D(ctx, cx, groundY, scale, s, rngFrom(fnv1a(`${piece.id}:${frame.tick}`)));
        });
      }

      // One renderer reused for every 3D canvas: a WebGL context per canvas
      // would blow past the browser's context limit on a sheet this size.
      const shared = document.createElement('canvas');
      const renderer = new THREE.WebGLRenderer({ canvas: shared, antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      const characters = { ally: buildCharacter3D('ally'), enemy: buildCharacter3D('enemy') };

      function render3D(ctx, W, H, frameIndex) {
        const frame = view.frames[frameIndex];
        const prev = frameIndex > 0 ? view.frames[frameIndex - 1] : null;
        const { scene, camera } = createScene3D(W, H);
        const spread = 46;

        const order = [...frame.pieces].sort((a) => (a.side === 'ally' ? -1 : 1));
        order.forEach((piece, i) => {
          const s = signalsFor(piece, frame, prev, view);
          s.facing = i === 0 ? 1 : -1;
          const pose = poseFor(s, PHASE);
          const character = characters[piece.side];
          applyPose3D(character, pose, s);
          character.root.position.set(i === 0 ? -spread : spread, 0, i === 0 ? 10 : -10);
          scene.add(character.root);
        });

        renderer.setPixelRatio(DPR);
        renderer.setSize(W, H, false);
        renderer.render(scene, camera);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(shared, 0, 0, W, H);
        for (const c of Object.values(characters)) scene.remove(c.root);
      }

      const STYLES = [
        { id: '1-bone2d', label: '1 — 2D 본 리그 + 실루엣 (Canvas 2D)', render: render2D },
        { id: '2-cel3d', label: '2 — 3D 로우폴리 + 셀 셰이딩 + 고정 카메라 (Three.js)', render: render3D },
      ];

      function makeCanvas(parent, size, id) {
        const cv = document.createElement('canvas');
        cv.width = size.w * DPR;
        cv.height = size.h * DPR;
        cv.style.width = size.w + 'px';
        cv.style.height = size.h + 'px';
        if (id) cv.id = id;
        parent.appendChild(cv);
        const ctx = cv.getContext('2d');
        ctx.scale(DPR, DPR);
        return ctx;
      }

      const rows = document.getElementById('rows');
      for (const style of STYLES) {
        const row = document.createElement('section');
        row.className = 'row';
        const h = document.createElement('h2');
        h.textContent = style.label;
        row.appendChild(h);
        const strip = document.createElement('div');
        strip.className = 'strip';
        for (const tick of TICKS) {
          const fig = document.createElement('figure');
          const ctx = makeCanvas(fig, SMALL);
          style.render(ctx, SMALL.w, SMALL.h, tick.index);
          const cap = document.createElement('figcaption');
          const cues = [...new Set(view.frames[tick.index].pieces.flatMap((p) => p.cues))].join('·');
          cap.textContent = `t${view.frames[tick.index].tick} · ${tick.note} · ${cues}`;
          fig.appendChild(cap);
          strip.appendChild(fig);
        }
        row.appendChild(strip);
        rows.appendChild(row);
      }

      const details = document.getElementById('details');
      for (const style of STYLES) {
        const box = document.createElement('section');
        const h = document.createElement('h2');
        h.textContent = style.label + ' — 상세 (교전 tick)';
        box.appendChild(h);
        const ctx = makeCanvas(box, LARGE, `detail-${style.id}`);
        style.render(ctx, LARGE.w, LARGE.h, 3);
        details.appendChild(box);
      }

      window.__READY__ = true;
    </script>
  </body>
</html>
