reentry_recap: 외원 담장 너머에서 청류문식 흐름을 훔쳐 쓴 심부름꾼을 목격했지만 대치는 피했다. 다음 날 객잔 처마에서 말린 젖은 봉투가 발견되고, 봉투에는 청류문 생존자에게 보내는 개인적인 구명 요청이 들어 있다.
stable_opening: 아침부터 객잔 처마에 걸어 둔 봉투가 천천히 마른다. 객잔 주인은 배달 장부를 내밀고, 서하린은 봉인만 살핀다. 봉투를 연 사람은 명령서가 아니라 누군가의 마지막 부탁을 읽게 된다.
local_urgent_conflict: 발신자와 봉투의 안전을 확인하면서도 사적인 구명 요청을 함부로 공개하지 않을 방법을 정한다. 답장을 마친 뒤에도 즉시 황천수맥으로 출동하지 않고, 기록·식사·휴식의 시간을 남긴다.
beats_and_dialogue:
  - {beat: 처마 아래의 젖은 봉투, scene: 밤비에 젖은 봉투와 객잔 배달 장부를 나란히 말린다. 봉인은 깨지지 않았지만 글씨 일부가 번졌다., dialogue: '객잔 주인: “공식 문서라면 이런 식으로 사람 이름을 숨기지 않소. 이건 누군가 살려 달라는 편지에 가깝군.”'}
  - {beat: 봉투 속의 두 문장, scene: 편지에는 청류문 쪽 사람이 살아 있다는 확인과 개인적인 구조 요청이 따로 적혀 있다., dialogue: '주인공: “살아 있다는 답과 데려와 달라는 부탁을 한 문장으로 만들면, 둘 다 잃을 수 있습니다.”'}
  - {beat: 서하린의 선, scene: 서하린은 내용 전체를 대신 읽지 않고, 답장에 자신의 이름과 침묵을 어디까지 쓸지 선택하게 한다., dialogue: '서하린: “제가 증인이 될 수는 있어요. 하지만 제 이름을 빌려 누군가를 움직이게 하지는 말아 주세요.”'}
  - {beat: 발신자 없는 장부, scene: 객잔 장부에는 봉투를 맡긴 손님이 없고, 젖은 소매 자국과 남쪽 물길 시간만 남아 있다., dialogue: '객잔 주인: “찾을 수 있는 건 사람의 이름이 아니라, 언제 누가 처마 밑에 섰는지요.”'}
  - {beat: 네 가지 답장 방식, scene: 발신자를 찾거나 봉투를 돌려보내거나 내용을 제한적으로 공개하거나 청류문 증인을 세운 뒤 답장을 쓴다., dialogue: '주인공: “답장을 보내는 일과 사람을 구하러 떠나는 일은 같은 일이 아닙니다. 오늘은 전자만 끝내겠습니다.”'}
  - {beat: 저녁의 봉인, scene: 답장과 원문을 분리 봉인하고 식사를 한 뒤, 다음 조사를 위한 보관 위치와 재진입 조건을 기록한다., dialogue: '서하린: “오늘 우리가 지킨 건 비밀만이 아니에요. 살아 있다는 말을 살아 있는 사람의 선택으로 남긴 거예요.”'}
