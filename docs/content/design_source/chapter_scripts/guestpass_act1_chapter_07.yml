rewards:
  - name: 패배 복기 쪽지
    type: insight
    concept: 실패를 재능 판정이 아니라 다음 행동 하나로 바꾸는 기록.
  - name: 청류문 일과표
    type: quest_clue
    concept: 메인 사건 사이에 회복·잡역·식사·훈련을 삽입할 수 있는 실제 생활 리듬.
quest_clues:
  - name: 창고의 낡은 짐
    type: investigation_hook
    concept: 1/08에서 불탄 객패와 청류문 손님 기록을 연결할 조사 대상.
flags:
  always: [first_training_failure_reviewed, qingliu_daily_rhythm_known, no_raid_after_training, qingliu_first_training_review_resolved, protagonist_recovering_at_qingliu, qingliu_chore_sparring]
  success: [training_review_method_selected]
  failure: [small_chore_debt_or_rumor_recorded]
local_closure: 패배는 대련장에 남지 않고 저녁 식사와 창고 정리로 흡수된다. 서하린은 모든 답을 주지 않은 채, 다음에는 발의 압력 하나만 다시 보자고 약속한다.
interlude_safe_state: 일과표에 따라 잡역·세탁·식사·가벼운 재활·창고 정리가 가능하다. 서하린과의 짧은 대화와 다른 문인들의 생활 사건을 넣을 수 있으며 습격은 없다.
low_pressure_hook: 창고 구석의 탄 나무와 접힌 천에서 객패처럼 보이는 가장자리가 드러나지만, 지금 당장 열어 보지 않아도 된다.
next_reentry_trigger: 패배 원인 하나가 기록되고, 적어도 한 번의 식사·휴식·잡역이 지나 창고 정리나 저녁 대화에서 낡은 짐을 꺼내 볼 수 있게 될 때 1/08이 열린다.
