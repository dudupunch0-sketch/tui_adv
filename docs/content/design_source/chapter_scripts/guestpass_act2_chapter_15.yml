    label: 못 본 척하기
    immediate_result: 주인공은 캐묻지 않되 당번표의 무거운 칸을 공동 작업으로 표시한다.
    success: 서하린이 자기 상태를 말할 자리를 얻고 손목을 쓰지 않는 당번으로 교대한다.
    failure: 침묵이 방치로 읽혀 서하린이 무리한다. 저녁에 당번표를 함께 고친다.
