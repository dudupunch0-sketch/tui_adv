local_closure: 산문 당번·약방 돌봄표·기록함 열쇠가 며칠 유지 가능한 순서로 정리된다. 붉은 재는 봉인되고 누구도 외부를 쫓지 않는다. 습격은 아직 시작되지 않았으며 불안은 식사와 휴식으로 닫힌다.
interlude_safe_state: 식사·수면·약방 잡역·기록 정리·경계 교대를 삽입할 수 있다. 객패와 명부는 기록함에 있고 서하린은 당번표에 기록을 남긴다.
low_pressure_hook: 며칠 뒤 같은 방향의 붉은 재나 이름 없는 전달끈이 돌아오면 준비표의 우선순위를 다시 고를 수 있다.
next_reentry_trigger: 조사 완료와 며칠의 생활형 간격 뒤 산문·약방·손님채가 동시에 위협받는 징후가 확인되면 2/10이 열린다. bloodmoon_raid_omen_enabled만으로는 열리지 않는다.
