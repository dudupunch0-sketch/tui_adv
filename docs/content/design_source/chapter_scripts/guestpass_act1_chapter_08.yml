  cast: [주인공, 서하린, 청우진, 청류문 당번]
  emotional_state: 발견을 서둘러 쫓아가고 싶은 마음과 증거를 보존해 사람을 지켜야 한다는 판단 사이의 긴장
convergence:
  meaningful_exclusive_outcomes: 재 닦기는 환대 이해, 각인 배열은 이동 경로, 열흔 보존은 물리 파괴 방식, 장부 대조는 공동체 기록과 빈 장을 앞세운다.
  common_minimum_facts: [guestpass_burnt_token_acquired, guestpass_destroyed_network_mark_present, guestpass_first_owner_last_route_record_present, guestpass_single_causal_chain_opened, guestpass_destroyed_network_mark_seen, guestpass_first_owner_route_notches_seen]
  local_closure: 객패를 모두가 지키는 증거로 봉인하고 산문 경계를 조용히 강화한다. 즉시 습격·전투·출발은 없다.
  exact_state_bridge: 며칠의 생활 사이에 외부 표식과 장부 공백이 누적되어 청류문이 습격 전조를 정식 조사하기로 결정하면 2/09가 재진입한다.
  next_slot: 2/09
  next_event_ref: wuxia_cheongryu_raid_omen
  terminal: false
