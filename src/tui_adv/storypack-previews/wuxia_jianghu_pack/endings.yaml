endings:
  - id: wuxia_preview_grounded
    name: 출근 완료 — 강호의 사원증
    kind: game_over
    priority: 10
    conditions:
      required_flags: [wuxia_arrival_grounded]
    text: 사원증을 움켜쥔 순간, 당신은 끝내 낯선 강호의 사람이 되지 못했다. 천기록은 회사와 이름이 찍힌 작은 패찰만을 한 장의 부적으로 남기고 붓을 거둔다. 돌아갈 출근길도, 이어질 강호행도 없다. 이번 기록은 여기서 끝이다.

  - id: wuxia_final_epilogue_renderer_contract
    name: 이구학지 결산
    kind: final_epilogue_contract
    priority: 900
    conditions:
      locations: [black_serpent_ledger_vault]
      required_flags: [boss_resolution_resolved, mumyeong_resolution_resolved, seoharin_qingliu_resolution_resolved, cheongirok_resolution_resolved, black_serpent_aftermath_resolved, final_result_priority_applied_seeded, final_state_routing_seeded]
    text: 사도의 장부고가 조용해지자 천기록은 마지막 장을 다시 펼친다. 이제 선택지는 없다. 지금까지 남긴 씨앗을 Rust GameCore가 읽고, 후일담 카드는 계산이 아니라 기록으로만 출력된다.

  - id: wuxia_death_rest
    name: 천기록 안식
    kind: death
    priority: 999
    conditions:
      max_resources: { health: 0 }
    text: 당신은 깊은 안식에 도달했습니다. 천기록의 붉은 획들은 완전히 흩어지고, 낯선 세계에서의 힘겨웠던 출근길도 마침내 끝이 납니다.
