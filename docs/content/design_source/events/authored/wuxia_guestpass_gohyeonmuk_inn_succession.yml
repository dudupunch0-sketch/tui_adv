id: wuxia_guestpass_gohyeonmuk_inn_succession
kind: event
status: authoring_draft
review_status: authoring_review_required
runtime_status: not_implemented
source_refs:
- source: user-approved-local-design
  arc_path: arcs/guestpass_homecoming_main_story_v1_1.md
  mapping_path: arcs/guestpass_homecoming_main_story_v1_1_event_mapping.md
  slot: 3/18 고현묵 객잔과 객패 계승
storypack_id: wuxia_jianghu_pack
arc_id: arc_guestpass_homecoming_main_story_v1_1
act: 3
global_slot: 18
title: 고현묵 객잔과 객패 계승
narrative_role: >-
  불탄 객패와 최초 소유자의 흔적을 들고 온 주인공을 객잔 주인 고현묵이 곧바로 믿지 않고,
  낯선 손님을 실제로 어떻게 대하는지 행동으로 시험한다. 객패 계승을 소유권 획득이 아니라
  다음 사람을 살아서 보내는 책임의 인수로 정의하고, 서하린과의 여행 대화를 3/19 빈방 압류 소식에 잇는다.
entry_conditions:
  required_flags:
  - guestpass_first_relay_identity_chosen
  - guestpass_burnt_token_acquired
  optional_context_flags:
  - guestpass_first_owner_last_route_record_present
  - seoharin_shared_departure_resolved
  - qingliu_guestpass_archive_link_opened
  blocked_by: []
role_constraints:
  go_hyeonmuk: 객잔을 먹고 자고 의심하고 돕는 인간의 장소로 운영하며 증거와 행동으로 판단하는 사람이다.
  seo_harin: 주인공 대신 답하지 않고 선택을 지켜본 뒤 여행 중 쌓인 신뢰와 우려를 솔직히 말한다.
  protagonist: 객패를 권리 증표로 내세우지 않고 어떤 손님이자 전달자가 될지 행동으로 증명한다.
  oracle_or_prophecy_delivery: forbidden
  guestpass_ownership_transfer: forbidden
scene_flow:
- beat: 문턱의 의심
  content: 고현묵은 불탄 객패를 알아보지만 문을 활짝 열지 않고 최초 소유자가 남긴 흠집을 어디서 얻었는지 따져 묻는다.
- beat: 늦은 객잔
  content: 비를 맞은 행상인, 열이 오른 아이, 방값이 모자란 나그네가 한꺼번에 들어오며 말보다 먼저 주인공의 환대를 시험한다.
- beat: 서하린과의 짧은 식사
  content: 서하린은 국을 나눠 먹으며 객패를 얻는 것이 돌아갈 길을 얻는 일인지 또 다른 짐을 드는 일인지 묻는다.
- beat: 행동의 증거
  content: 주인공은 기록 공개, 객잔 노동, 위험한 손님 보호, 계승 책임의 명시 중 하나로 자신이 어떤 손님인지 답한다.
- beat: 객패를 다시 건네는 손
  content: 고현묵은 새 객패를 주지 않고 불탄 객패를 돌려주며 다음 사람을 살려 보낼 때까지 맡아 달라고 한다.
- beat: 청류문의 급보
  content: 시험이 끝날 무렵 빈방과 문패를 압류하겠다는 외부 통고가 청류문에서 도착해 서하린과 주인공이 즉시 다음 행동을 논의한다.
dialogue_beats:
- speaker: 고현묵
  line_intent: 객패를 가졌다는 사실보다 문턱에 쓰러진 손님을 먼저 볼 수 있는지를 묻는다.
- speaker: 주인공
  line_intent: 회사의 인수인계와 달리 책임이 서류에 사인하는 순간 끝나지 않는다는 점을 이해한다.
- speaker: 서하린
  line_intent: 청류문으로 돌아갈 이유와 길 위의 타인을 돕는 이유가 서로 경쟁하지 않아도 된다고 말한다.
- speaker: 고현묵
  line_intent: 최초 소유자도 완벽해서가 아니라 다음 사람을 포기하지 않았기에 객패를 맡았다고 증언한다.
effect_policy:
  numeric_effects: deferred
  rarity: deferred
  reward_ids: unassigned_until_authoring_review
choice_policy:
  normal_rewards: mutually_exclusive
  essential_clue_recovery: >-
    선택하지 않은 보상은 일반 경로에서 얻지 못한다. 고현묵의 신뢰나 최초 소유자 흔적의 해석이 부족해도
    객잔의 밤샘 노동, 다음 손님의 호송, 또는 3/21의 우회 추적으로 시간·여비·추적 노출 중 하나를 지불해
    다음 이동지 단서를 복구할 수 있다. 객패의 책임 인수와 3/19 급보는 모든 분기에서 열린다.
  hidden_dual_reward_route: not_approved
choices:
- id: disclose_token_and_route_record
  label: 불탄 객패와 이동 기록을 탁자 위에 모두 펼친다
  intent: 유리한 흔적만 고르지 않고 출처·오독 가능성·청류문에서 확인한 내용을 공개한다.
  immediate_result: 고현묵은 객패를 세 번 뒤집어 보고 최초 소유자가 남기던 매듭과 주인공의 설명을 대조한다.
  resolution:
    success: 최초 소유자가 마지막으로 묵은 방과 떠난 방향을 고현묵의 기억으로 좁힌다.
    failure: 이동 순서 하나가 맞지 않아 의심은 남지만 거짓말하지 않은 태도 덕분에 직접 확인할 장부를 허락받는다.
  relation_directions:
    people:
      go_hyeonmuk: positive_cautious_evidence_trust
      seo_harin: positive_truth_shared_on_road
    factions:
      guestpass_network: positive_record_stewardship
      qingliu: positive_evidence_not_hoarded
  quest_items_and_clues:
  - name: 고현묵의 객방 배치도
    type: quest_clue
    visibility: immediate_partial
    concept: 최초 소유자가 마지막 밤에 어느 문과 마구간을 오갔는지 인간의 기억으로 보완한 객잔 도면.
  reward_candidate:
    name: 의심을 견딘 손님
    type: title
    concept: 믿어 달라고 재촉하지 않고 불완전한 증거까지 내놓아 검증받은 자.
  flags:
    always:
    - gohyeonmuk_token_evidence_examined
    success:
    - first_owner_last_inn_room_narrowed
    failure:
    - first_owner_route_order_requires_guestbook_check
- id: serve_the_unregistered_guests
  label: 장부보다 늦게 온 손님의 밥부터 챙긴다
  intent: 시험의 답을 말로 만들지 않고 방값이 모자란 사람도 밤을 넘기게 하는 환대를 실행한다.
  immediate_result: 주인공과 서하린이 솥과 자리를 나눠 맡고 고현묵은 아무 말 없이 빈 그릇의 수를 센다.
  resolution:
    success: 행상인이 최초 소유자에게 구조받았던 기억과 다음 중계소의 별칭을 털어놓는다.
    failure: 식량 배분이 꼬여 주인공 몫을 내주지만 열이 오른 아이가 지닌 낡은 길매듭을 발견한다.
  relation_directions:
    people:
      go_hyeonmuk: strong_positive_hospitality_proven
      seo_harin: strong_positive_shared_daily_labor
    factions:
      guestpass_network: strong_positive_guest_duty_enacted
      qingliu: positive_values_carried_on_road
  quest_items_and_clues:
  - name: 두 번째 밥그릇의 길매듭
    type: quest_item
    visibility: delayed_meaning
    concept: 이름이 장부에 오르기 전에도 한 사람의 자리를 남겨 둔 귀로객망의 오래된 매듭.
  reward_candidate:
    name: 두 번째 밥그릇
    type: quest_item
    concept: 자신의 몫 옆에 아직 오지 않은 손님 한 사람의 자리를 남겨 두는 환대의 표식.
  flags:
    always:
    - guestpass_unregistered_guest_sheltered
    success:
    - guestpass_next_relay_alias_learned
    failure:
    - guestpass_old_route_knot_recovered
- id: shelter_the_suspected_courier
  label: 쫓기는 전령을 뒷문으로 들인다
  intent: 혈월교의 추적을 달고 왔을 수 있는 손님을 무조건 믿지도 내치지도 않고 격리·치료·확인한다.
  immediate_result: 서하린과 피신 동선을 나눠 전령을 숨기고 고현묵은 주인공이 위험을 다른 손님에게 떠넘기지 않는지 본다.
  resolution:
    success: 전령을 살리고 파괴된 귀로객망 다음 지점의 봉인 조각을 확보한다.
    failure: 추적자가 객잔 주변을 훑어 위험이 커지지만 전령이 남긴 신발 흙으로 다음 산길을 특정한다.
  relation_directions:
    people:
      go_hyeonmuk: positive_responsible_risk_sharing
      seo_harin: positive_coordinated_protection
    factions:
      guestpass_network: positive_courier_protected
      qingliu: neutral_risk_did_not_transfer_home
  quest_items_and_clues:
  - name: 반쪽 귀로 봉인목
    type: quest_clue
    visibility: immediate_partial
    concept: 파괴된 중계소가 마지막으로 보낸 사람과 외안배산귀 산길을 가리키는 반쪽 나무 봉인.
  reward_candidate:
    name: 객잔 뒷문의 매듭법
    type: skill
    concept: 위험한 손님을 숨기되 다른 사람의 피난길과 섞이지 않도록 동선을 매듭짓는 현장 요령.
  flags:
    always:
    - guestpass_suspected_courier_sheltered
    success:
    - guestpass_broken_relay_seal_recovered
    failure:
    - guestpass_next_mountain_soil_identified
- id: accept_stewardship_not_ownership
  label: 소유 대신 다음 손님까지의 책임을 적는다
  intent: 객패를 내 것이라 주장하지 않고 언제 누구에게 어떤 상태로 넘길지를 고현묵과 서하린 앞에서 명시한다.
  immediate_result: 현대식 인수인계표처럼 책임 항목을 적었다가 사람을 항목으로 만들 수 없음을 깨닫고 문장을 고쳐 쓴다.
  resolution:
    success: 고현묵이 객패 가장자리에 임시 수탁 매듭을 더하고 최초 소유자의 미완성 전달 문구를 알려 준다.
    failure: 약속이 지나치게 딱딱해 핀잔을 듣지만 서하린과 함께 실제 위기 때의 책임 범위를 다시 정한다.
  relation_directions:
    people:
      go_hyeonmuk: positive_stewardship_acknowledged
      seo_harin: strong_positive_shared_burden_defined
    factions:
      guestpass_network: strong_positive_succession_as_duty
      qingliu: positive_return_responsibility_preserved
  quest_items_and_clues:
  - name: 객패 임시 수탁 매듭
    type: quest_item
    visibility: immediate
    concept: 소유자를 표시하지 않고 다음 손님에게 안전하게 넘길 책임을 맡았음을 나타내는 매듭.
  reward_candidate:
    name: 인수인계는 퇴근 전에
    type: insight
    concept: 책임은 서명으로 끝나는 업무가 아니라 다음 사람이 무사히 이어받을 때 비로소 닫힌다는 현대인의 재해석.
  flags:
    always:
    - guestpass_stewardship_terms_spoken
    success:
    - guestpass_temporary_steward_knot_added
    failure:
    - seoharin_stewardship_scope_rewritten
convergence:
  common_flags:
  - guestpass_gohyeonmuk_inn_test_resolved
  - guestpass_inn_inheritance_resolved
  - guestpass_stewardship_accepted
  - gohyeonmuk_human_witness_opened
  - qingliu_empty_room_seizure_notice_received
  next_required_slot: 3/19 청류문 빈방 압류 방어
  later_links:
  - slot: 3/19
    use: 고현묵의 시험에서 택한 증거·환대·보호·책임 방식이 빈방의 이름과 자리를 지키는 대화 근거가 된다.
  - slot: 3/20
    use: 객패를 소유가 아닌 책임으로 받아들였다는 공통 플래그가 외안배산귀의 이름·환대 시험을 연다.
  - slot: 5/35
    use: 고현묵은 예언자가 아니라 당시 행동과 수탁 매듭을 확인하는 인간 증인으로 돌아온다.
  progression_guarantee: 모든 분기는 객패 책임 인수와 빈방 압류 급보를 열며 실패는 신뢰·노출·정보량·복구 비용만 바꾼다.
stages: []
