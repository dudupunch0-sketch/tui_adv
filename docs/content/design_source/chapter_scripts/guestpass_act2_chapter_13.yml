local_closure: 저녁 종이 울릴 때 선택한 한 기능이 다시 쓰인다. 나머지 파손은 천막과 표지로 막고 재건의 빚은 다음 당번표에 남긴다. 적·추격·붕괴는 시작되지 않는다.
interlude_safe_state: 며칠 동안 회복 식사, 약재 분류, 잡역 당번, 가벼운 수련, 서하린 손목 확인을 삽입할 수 있다. 객패 해독 기록은 기록함에 보관한다.
low_pressure_hook: 빈 당번 칸의 주인을 찾을지, 사라진 약재 흔적을 조사할지, 서하린과 안전한 발놀림을 복기할지 고를 수 있다.
next_reentry_trigger: 재건표의 빈칸과 객패 경로가 며칠의 생활 기록에서 같은 외부 방향을 가리키고 조사 준비가 되면 2/14가 열린다.
