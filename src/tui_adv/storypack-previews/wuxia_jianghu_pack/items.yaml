items:
  - id: commuter_badge
    name: 사원증
    description: 현대 회사원의 이름과 사진이 남은 얇은 플라스틱 카드.
    type: clue
    tags: [identity, wuxia_preview]

  - id: cheonggi_record_notebook
    name: 천기록이 깃든 업무수첩
    description: 빈 장에 현대 지식의 편린이 먹물처럼 떠오르는 업무수첩. 검색창도 즉시 보상도 아니다.
    type: clue
    tags: [notebook, cheonggi_record, wuxia_preview]

  - id: work_chore_token
    name: 청류문 잡일패
    description: 석 달 수습 기간 동안 물 긷기, 장작 패기, 연무장 청소를 맡았다는 작은 나무패.
    type: quest
    tags: [cheongryu_sect, apprenticeship, chore, wuxia_preview]

  - id: rejected_aid_letter_fragment
    name: 거절당한 도움 요청 서찰 조각
    description: 무명이 청류문을 살리려 정파 문파에 보냈으나 돌아온 도움 요청 서찰의 찢긴 조각.
    type: clue
    tags: [mumyeong, orthodox_refusal, failed_aid, wuxia_preview]

  - id: modern_first_aid_pouch
    name: 현대식 응급 파우치
    description: 익숙한 포장과 낯선 약초 냄새가 함께 남은 작은 응급 파우치.
    type: quest
    tags: [reward, medicine, wuxia_preview]
    usable: false
    reveal_immediate: true

  - id: empty_medicine_ledger
    name: 빈 약장부
    description: 이름과 용량이 모두 지워진 약재 기록장. 후속 회수 전까지 정체를 공개하지 않는다.
    type: quest
    tags: [reward, medicine, pending, wuxia_preview]
    usable: false
    reveal_immediate: false

  - id: cracked_whistle
    name: 금 간 호각
    description: 한 번 불면 낮은 음만 남는 순찰용 호각.
    type: quest
    tags: [reward, patrol, wuxia_preview]
    usable: false
    reveal_immediate: true

  - id: red_thread_fragment
    name: 붉은 실 조각
    description: 약탕기 손잡이에 묶였던 붉은 실의 일부. 후속 회수 전까지 정체를 공개하지 않는다.
    type: quest
    tags: [reward, clue, pending, wuxia_preview]
    usable: false
    reveal_immediate: false

  - id: wet_gate_register
    name: 젖은 문지기 장부
    description: 비에 번진 순찰 명부. 후속 회수 전까지 정체를 공개하지 않는다.
    type: quest
    tags: [reward, gate, pending, wuxia_preview]
    usable: false
    reveal_immediate: false

  - id: life_talisman
    name: 목숨 부적
    description: 생명을 대신하지는 않지만, 한 번의 망설임을 붙잡아 두는 낡은 부적.
    type: quest
    tags: [reward, survival, wuxia_preview]
    usable: false
    reveal_immediate: true

  - id: seoharin_handkerchief
    name: 서하린의 손수건
    description: 훈련 중 감춘 상처를 싸맨 손수건. 후속 회수 전까지 정체를 공개하지 않는다.
    type: quest
    tags: [reward, seoharin, pending, wuxia_preview]
    usable: false
    reveal_immediate: false
