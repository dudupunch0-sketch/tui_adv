reentry_recap: 첫 답장은 사적 구명 요청으로 봉인되었고 물때와 객패가 황천수맥을 열었다.
stable_opening: 주인공은 현대 몸·출근복·사원증과 객패를 확인하고 서하린과 수맥 입구에 선다. 맹인 노백운은 물소리·돌 촉감·과거 통행 기억만 대조한다.
local_urgent_conflict: 수맥은 예언 없이 경로의 잔향만 보인다. 최초 소유자 마지막 경로를 회수하고 장내 조사를 닫는다.
beats_and_dialogue:
- {beat: 협곡, scene: 이름이 긁힌 벽과 스미는 물, dialogue: '서하린: “누가 남겨졌는지부터 확인해요.”'}
- {beat: 발판, scene: 노백운이 지팡이로 돌과 물방울을 센다, dialogue: '노백운: “나는 보지 못하오. 소리와 촉감만 맞추오.”'}
- {beat: 신분, scene: 사원증·출근복·객패를 분리 기록한다, dialogue: '주인공: “이건 귀환 정답이 아니라 제 연속성이에요.”'}
- {beat: 네 문턱, scene: 이름·빚·출근길 기억·물리 흔적 중 하나가 잔향을 연다, dialogue: '노백운: “무엇을 내놓든 길 전체는 열리지 않소.”'}
- {beat: 증언, scene: 객패 각인과 물결이 버린 길과 멈춘 지점을 보인다, dialogue: '잔향: “이름… 멈춤… 발판…”'}
- {beat: 대조, scene: 서하린이 물리 단서와 불확실성을 나눈다, dialogue: '서하린: “맞은 것만 기록해요.”'}
- {beat: 종결, scene: 기록을 봉인하고 쉼터로 나온다, dialogue: '주인공: “정답이 아니라 확인 가능한 경로를 회수했어요.”'}
