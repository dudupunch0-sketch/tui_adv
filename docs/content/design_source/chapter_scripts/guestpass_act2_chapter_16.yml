reentry_recap: 청류문은 습격 뒤 부상자와 시설을 안정시켰고 객패 각인 일부와 흑사방 장부 경로를 맞췄다. 서하린의 손목은 치료와 당번 조정으로 일상에 돌아왔지만 오래된 부상은 남아 있다. 이제 출발은 가능하되 방식마다 비용이 있다.
stable_opening: 며칠 뒤 청류문 외곽 작은 야영지에 짐 세 꾸러미와 봉인한 객패 기록이 놓인다. 주인공은 출근 가방에서 메모만 꺼내고, 서하린은 보호대를 한 채 이동 표식을 확인한다. 누구도 당장 쫓지 않는다.
local_urgent_conflict: 다음 역참 흔적을 따라갈 사람과 청류문에 남을 사람을 정해야 한다. 시간·지원·추적의 질 중 하나를 일부 포기해야 하며, 영구 귀환·정착·이별은 결정하지 않는다.
beats_and_dialogue:
  - beat: 안정된 뒤의 출발
    scene: 청우진은 치료실 명단과 수리 항목을 읽고 산문을 비워 두지 않아도 된다고 말한다.
    dialogue: '청우진: “문이 다시 닫힐 수 있을 때 나가는 것과, 무너진 채 나가는 것은 다르다.”'
  - beat: 반쪽 해독
    scene: 주인공은 객패 각인을 환승 순서처럼 배열하고 흑사방 장부의 비워 둔 역참을 표시한다.
    dialogue: '주인공: “도착지는 못 박지 못해도, 어느 길이 빚으로 비워졌는지는 보입니다.”'
  - beat: 손목과 속도
    scene: 서하린은 동행할 수 있지만 야간 이동은 어렵다고 말한다. 주인공은 동행을 당연한 보상처럼 계산하지 않는다.
    dialogue: '서하린: “따라가야 한다고 정하지 말고, 제가 남는 비용도 같이 적어요.”'
  - beat: 세 칸의 비용표
    scene: stay_time, leave_support, trace_pursuit 세 칸 중 하나를 고른다. 고르지 않은 비용은 다음 역참에서 다시 협상할 수 있다.
    dialogue: '청우진: “시간을 쓰면 흔적이 늦고, 사람을 데려가면 문이 가벼워지고, 흔적만 좇으면 기록이 얇아진다.”'
  - beat: 공동 포장
    scene: 객패 기록·약재·식량·당번 인계가 방수 천에 싸인다. 방향은 정하지만 밤길 추격은 약속하지 않는다.
    dialogue: '주인공: “답을 찾았다는 뜻이 아니라, 답이 있는 쪽으로 갈 준비가 됐다는 뜻이죠.”'
  - beat: 야영지의 저녁
    scene: 두 길표와 빈 길표가 남고, 일행은 식사와 잠자리를 정한 뒤 3/17에서 신분을 고르기로 한다.
    dialogue: '서하린: “첫 질문은 길에서 하지 말아요. 역참 문 앞에서 우리가 누구인지부터 정해요.”'
choices:
  - id: first_departure_stay_until_stable
    label: 부상자들이 안정될 때까지 남는다
    immediate_result: 며칠 더 치료·수리·장부 대조를 하고 외곽 야영지에서 출발한다.
    success: 출발 지원과 인계가 넉넉해지지만 다음 역참 흔적은 희미해진다.
    failure: 기다리는 동안 장부 빈칸이 늘지만 부상자와 기록은 안전하게 인계된다.
    relationship_directions: {people: {seo_harin: duty_trusted_over_speed, cheong_u_jin: qingliu_reciprocity_strengthened}, factions: {qingliu: recovery_first_departure_support, guestpass_network: trace_delayed_not_lost}}
    reward_candidate: {name: 닫힌 문을 확인한 표, type: route_clue, concept: 남은 사람과 기록의 안전을 확인한 출발 증표}
    quest_clue: {name: 안정화 인계표, type: quest_clue, concept: 치료·수리·당번 인계가 다음 역참 신뢰가 되는 증거}
    flags: {always: [qingliu_first_departure_cost_resolved, qingliu_departure_staging_opened, first_route_cost_recorded, stay_time_paid], success: [leave_support_strengthened], failure: [trace_pursuit_delayed, ledger_gap_widened]}
  - id: first_departure_follow_outbound_support
    label: 외부로 나갈 사람을 따라 떠난다
    immediate_result: 외부 약재와 수리 자재를 받으러 가는 소규모 행렬에 합류하고 객패 기록은 봉인해 운반한다.
    success: 이동 인력과 짐을 확보하고 안전한 속도로 외부 표식까지 간다. 서하린의 손목 당번은 문 안에 남는다.
    failure: 행렬 목적지와 객패 흔적이 어긋나 추적 정보가 분산되지만 외부 신분 질문을 배운다.
    relationship_directions: {people: {seo_harin: agency_preserved_at_departure, cheong_u_jin: practical_support_exchange}, factions: {qingliu: leave_support_spent, guestpass_network: outside_route_contact_opened}}
    reward_candidate: {name: 세 번 접은 외출패, type: trade_token, concept: 청류문이 외부 문턱까지 책임지는 임시 통행 표}
    quest_clue: {name: 외부 거래처의 문턱 질문, type: route_clue, concept: 이름보다 보증을 먼저 묻는 다음 역참 규칙}
    flags: {always: [qingliu_first_departure_cost_resolved, qingliu_departure_staging_opened, first_route_cost_recorded, leave_support_spent], success: [outside_route_contact_opened], failure: [route_purpose_misaligned, station_identity_question_prepared]}
  - id: first_departure_trace_with_seoharin
    label: 서하린과 습격 흔적을 조사한다
    immediate_result: 둘은 야영지의 발자국·재·장부 숫자를 대조하고 손목을 쓰지 않는 조사 역할을 정한다.
    success: 객패와 흑사방 장부가 같은 외곽 역참을 가리켜 추적 근거가 두 겹이 된다.
    failure: 비에 흔적이 씻겨 지점은 좁혀지지 않지만 서하린의 무리하지 않을 선이 기록된다.
    relationship_directions: {people: {seo_harin: field_partnership_with_wrist_limit, cheong_u_jin: evidence_return_expected}, factions: {qingliu: trace_pursuit_prioritized, guestpass_network: partial_route_crosschecked}}
