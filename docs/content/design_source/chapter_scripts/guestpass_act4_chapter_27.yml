reentry_recap: 2/14에 확인한 것은 흑사방 채무선의 장부 조각과 객패 경로의 겹침뿐이었다. 이번에는 조각을 다시 소유하지 않고, 원장부가 어디에 있고 누가 보관하며 어떤 순서로 대조해야 하는지만 확인한다.
stable_opening: 맑아진 오후, 주인공은 현대 출근복 차림과 사원증을 안쪽으로 돌려 걸고 오래된 중개 창고의 반출표를 펼친다. 서하린은 손목을 쉬게 하며 장부 조각 대신 봉인 자국·보관자 표식·객패 통행 흔적을 비교한다.
local_urgent_conflict: 원장부의 위치를 캐묻는 방식이 보관자를 위험에 빠뜨릴 수 있다. 네 선택은 물건을 훔치거나 적을 자극하지 않고 위치·보관자·대조 경로 중 무엇을 우선 증명할지 결정한다. 고정 카운트다운·즉시 전투·즉시 다음 전투는 없다.
beats_and_dialogue:
  - {beat: 조각과 다른 질문, scene: 4/14의 봉랍 탁본을 다시 펼치되 원본 조각은 꺼내지 않고 반출표의 빈 칸과 날짜만 맞춘다., dialogue: '주인공: “이번 보상은 장부가 아닙니다. 어디에 있고, 누가 맡았고, 무엇과 맞춰야 하는지입니다.”'}
  - {beat: 세 겹의 보관 흔적, scene: 창고의 매듭·약재 운송표·객패 통행 각인이 같은 보관함을 직접 가리키지 않고 서로 다른 증거의 층을 이룬다., dialogue: '서하린: “위치 하나만 맞으면 사람을 몰아붙이게 돼요. 보관자와 대조 순서까지 있어야 멈출 수 있어요.”'}
  - {beat: 현대 몸의 한계, scene: 주인공은 구두가 미끄러운 창고 바닥에서 사원증 번호를 자로 쓰지 않고, 회사식 표 대신 손으로 세 칸 대조표를 만든다., dialogue: '주인공: “출근증이 문을 열어 주진 않지만, 내가 누구인지 숨기지 않는 선은 정할 수 있습니다.”'}
  - {beat: 서하린의 결정권, scene: 서하린은 자신의 과거를 보증인으로 쓰지 않을지, 증언 범위를 어디까지 열지 직접 정한다., dialogue: '서하린: “제 기억은 단서가 될 수 있어요. 하지만 제가 원장부의 열쇠인 척 쓰이진 않겠습니다.”'}
  - {beat: 네 갈래 대조, scene: 챙기기·부분 복사·태우기·제한 공개의 의미를 보관함 접근이 아닌 안전한 위치 증명 방식으로 나눈다., dialogue: '창고 주인: “원장부를 훔치지 않고도 길은 남길 수 있소. 다만 누구의 말인지 분명해야 하오.”'}
  - {beat: 역할을 섞지 않는 결산, scene: 혈월교의 물리 파괴 흔적은 봉인 파손으로만 따로 표시하고, 흑사방은 채무 보관선으로, 사도는 다음 장의 계산 협상 상대로 분리한다., dialogue: '서하린: “불탄 흔적은 혈월교, 빚의 보관선은 흑사방, 값을 계산하는 건 사도예요. 오늘 한 줄로 합치지 말아요.”'}
  - {beat: 저녁의 안전 봉인, scene: 선택한 위치 증거를 봉인하고 식사·손목 휴식·다음 날 재진입 조건을 적는다. 누구도 원장부로 출동하지 않는다., dialogue: '주인공: “오늘 얻은 건 문을 여는 열쇠가 아니라, 잘못된 문을 열지 않을 지도입니다.”'}
