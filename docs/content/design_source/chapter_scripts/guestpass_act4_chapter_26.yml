reentry_recap: 외원에서 청류문식 흐름을 훔쳐 쓴 무명을 목격했지만 이름과 목적은 확인하지 못했다. 이번에는 무명이 먼저 길을 막고, 주인공보다 조금 빠르고 강한 몸으로 이름을 요구한다. 서하린은 함께 있지만 대신 싸우거나 대신 대답하지 않는다.
stable_opening: 해 질 무렵, 주인공은 현대 출근복과 사원증을 그대로 지닌 채 물길 창고 뒤 좁은 마당에 선다. 무명은 퇴로를 완전히 막지 않고 한 걸음 비켜 서서, 주인공의 옷과 사원증을 낯선 문파 표식처럼 살핀다.
local_urgent_conflict: 무명이 주인공의 이름과 청류문에서 얻은 흐름의 출처를 묻는다. 완승·처치·추격은 목표가 아니며, 약간 우세한 라이벌의 압박 속에서 버티고 분석한 뒤 안전하게 이탈해야 한다. 서하린의 반응은 그녀가 직접 선택한다.
beats_and_dialogue:
  - {beat: 물길 창고의 막힌 길, scene: 무명이 한 번의 보법으로 주인공 앞을 가로막지만 칼끝은 내리지 않는다. 주인공은 젖은 출근복 소매와 구두의 미끄러움을 먼저 확인한다., dialogue: '무명: “이름도 길도 빌린 사람이, 왜 내 흐름을 보았지?”'}
  - {beat: 조금 빠른 상대, scene: 주인공이 한 발 늦게 물러나고 무명의 손등이 사원증 끈을 스친다. 서하린은 끼어들지 않고, 어디까지 개입할지 자신의 손목을 감싸며 판단한다., dialogue: '서하린: “제가 대신 말하지 않을게요. 하지만 멈추라고 하면 멈춰야 해요.”'}
  - {beat: 이름의 무게, scene: 무명은 이름을 밝히면 길을 열어 주겠다고 하지만, 그 말은 청류문과 흑사방 사이의 채무선과도 닿아 있다., dialogue: '주인공: “이름을 말하는 것과 당신이 그 이름의 주인이 되는 건 다른 일입니다.”'}
  - {beat: 다섯 갈래의 거리, scene: 맞서기·버티기·서하린의 반응 살피기·초식 읽기·도발하지 않기를 짧은 호흡 안에서 나눈다., dialogue: '서하린: “지금 필요한 건 이기는 장면이 아니라, 누가 무엇을 선택했는지 남기는 일입니다.”'}
  - {beat: 복사된 초식의 빈자리, scene: 무명의 흐름은 청류문식 모양을 닮았지만 마지막 디딤과 호흡의 연결이 비어 있다. 주인공은 그 약점을 이용해 끝내려 하지 않고 이탈 각도만 계산한다., dialogue: '주인공: “모양은 앞서지만, 중심이 한 박자 늦습니다. 그걸로 당신을 쓰러뜨릴 생각은 없습니다.”'}
  - {beat: 이름을 되찾는 반응, scene: 서하린은 무명의 질문에 침묵할지, 주인공의 이탈을 도울지 직접 말한다. 무명은 그 선택을 동료의 약점으로 만들려 하지만, 서하린은 자신의 선을 분명히 한다., dialogue: '서하린: “내가 본 것과 내가 말할 것은 내가 정해요. 누구의 빚도 대신 증언하지 않겠습니다.”'}
  - {beat: 마당을 벗어나는 발걸음, scene: 짧은 대치가 끝나고 무명은 다음 만남의 가능성만 남긴다. 주인공과 서하린은 창고 안으로 들어가지 않고 객잔 쪽 안전한 길로 돌아간다., dialogue: '무명: “오늘은 네가 버텼다고 해 두지. 다음에는 네 이름이 네 것인지 다시 묻겠다.”'}
