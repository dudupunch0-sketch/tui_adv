reentry_recap: 4/30 사도는 사람·객패·빚을 서로 다른 가격표로 나눠 보겠다고 제안했다. 주인공과 서하린은 거래를 확정하지 않고, 약초꾼의 두 번째 장부가 흑사방 원장부와 맞닿는다는 단서를 들고 돌아왔다.
stable_opening: 비가 그친 낮, 약초꾼 창고에서 주인공은 출근복 소매의 흙을 털고 사원증을 안쪽으로 돌려 단다. 서하린은 손목을 쉬게 하면서 장부의 끈과 약재 봉투 봉인을 먼저 살핀다.
local_urgent_conflict: 반환은 약초꾼을 보호하지만 원장부 대조선이 약해지고, 복사는 증거를 남기지만 채무자의 위치를 노출하며, 소각은 추적을 끊지만 회수 경로를 어렵게 한다. 즉시 잠입·전투·카운트다운은 없다.
beats_and_dialogue:
  - {beat: 말린 약재 사이, scene: 약초 봉투의 무게와 장부 숫자가 맞지 않는 한 줄을 발견한다., dialogue: '약초꾼: “두 번째 장부는 내 계산이고, 원장부는 내 이름을 빌린 계산이오.”'}
  - {beat: 현대 몸의 불편, scene: 주인공은 젖은 출근복과 굳은 구두로 좁은 창고를 오가며 수량을 종이에 옮긴다., dialogue: '주인공: “회사에서는 복사하면 끝이었는데, 여기서는 복사하는 순간 누가 빚을 지는지까지 따라옵니다.”'}
  - {beat: 서하린의 선, scene: 서하린은 결정을 대신하지 않고 보호·공개 범위를 자신의 말로 정한다., dialogue: '서하린: “제가 보호할 수는 있어요. 하지만 제 이름을 허락 없이 증거로 쓰지는 마세요.”'}
  - {beat: 세 갈래 원본, scene: 반환·복사·소각과 원장부 대조라는 네 방식이 장부 위에 놓인다., dialogue: '약초꾼: “돌려주면 숨고, 베끼면 들키고, 태우면 다시 찾을 길이 끊기오.”'}
  - {beat: 역할 분리, scene: 봉인 실밥에서 원장부 회수 표식을 확인한다., dialogue: '서하린: “혈월교는 물리 파괴, 흑사방은 채무, 사도는 계산이에요. 같은 적으로 합치면 안 돼요.”'}
  - {beat: 저녁 결산, scene: 선택한 기록을 봉인하고 식사·손목 휴식·다음 확인 날짜를 남긴다., dialogue: '주인공: “확보한 건 완성된 답이 아니라 세 요소를 대조할 자격의 일부입니다.”'}
