interlude_safe_state: 서하린은 가벼운 기록·식사·대화만 맡고 주인공은 약재·세탁·장부·산문 당번을 나눈다. 회복일과 1~2개 사이드, 약 7개 랜덤 인카운터가 가능하다.
low_pressure_hook: 약재함 뒤 객패 장부와 같은 날짜의 빈 먹점이 보이지만 지금 열지 않아도 된다.
