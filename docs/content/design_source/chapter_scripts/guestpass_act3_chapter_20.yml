  hostile_pressure: in-scene_gaze_and_stone_blockade_only; no_killing_no_countdown_no_sado
scene_context:
  location: 무너진 귀로객망 중계소와 외안배산귀가 지키는 산길
  cast: [주인공, 서하린, 외안배산귀]
  emotional_state: 이름을 숨기거나 맡기는 책임과 낯선 존재를 살려 통과해야 하는 조심스러운 결심
convergence:
  meaningful_exclusive_outcomes: 한 끼는 환대 회복, 관찰은 이름돌 배열, 기한부 이름은 책임의 경계, 돌팔 제압은 비살상 구조 대응을 보상한다.
  common_minimum_facts: [guestpass_one_eye_mountain_bearer_passage_resolved, one_eye_mountain_bearer_survival_preserved, guestpass_next_destination_trace_opened, guestpass_name_preservation_theme_reinforced, guestpass_route_to_next_movement_trace_opened]
  local_closure: 대치는 장내에서 비살상으로 끝나고, 배산귀는 생존하며, 제한적 환상은 이름돌을 잠깐 겹쳐 보인 현상으로만 기록된다.
  exact_state_bridge: 모든 분기는 다음 이동지의 제한적 흔적 하나와 안전한 interlude를 남긴 뒤 wuxia_route_return_scent_clue로 이어진다.
  next_slot: 3/21
  next_event_ref: wuxia_route_return_scent_clue
  terminal: false
