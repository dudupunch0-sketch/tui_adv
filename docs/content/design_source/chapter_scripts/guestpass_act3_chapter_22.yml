reentry_recap: 객잔의 현대 냄새와 물건은 귀환 증명이 아니었다. 창고의 젖은 검은 천은 흑사방 흔적처럼 보이며 주인공은 출근복과 사원증을 정리한 뒤 사람과 물건의 경로를 구분해 확인한다.
stable_opening: 객잔 주인은 장작더미 옆에서 낡은 검은 두건을 발견한다. 서하린은 손목을 아끼며 매듭을 살피고 주인공은 두건을 쓰지 않은 채 흑사방의 회수 질문을 묻는다.
local_urgent_conflict: 두건을 조사·태우기·변장·소문 탐색 중 처리한다. 정보는 바뀌지만 직접 대치나 사도 등장은 없다.
beats_and_dialogue:
  - {beat: 천의 매듭, scene: 안쪽 매듭과 젖은 흙을 확인하고 사원증과 분리해 둔다., dialogue: '서하린: “비슷한 검은색이라고 같은 길은 아니에요. 매듭이 어디서 묶였는지가 중요해요.”'}
  - {beat: 빚의 표식, scene: 이름 대신 물품·식사·운반 횟수가 적힌 장부 조각을 본다., dialogue: '주인공: “돈 한 줄이 아니라 누가 무엇을 대신 운반했는지의 기록이군요.”'}
  - {beat: 손목을 쓰지 않는 감식, scene: 서하린은 막대와 빛을 건네고 주인공이 매듭 위치를 표시한다., dialogue: '서하린: “제가 대신 만지지 않을게요. 당신도 제 손목을 대신 쓰게 하지 말고요.”'}
  - {beat: 회수선 지도, scene: 객패의 빈 역참과 두건의 흙·장작 냄새를 겹쳐 한 지점을 표시한다., dialogue: '객잔 주인: “회수하러 온 사람은 물건보다 먼저 빚을 물어요.”'}
  - {beat: 네 가지 처리, scene: 네 선택 중 하나를 택하고 천과 장부를 별도 봉투에 넣거나 흔적을 남긴다., dialogue: '주인공: “두건을 없애도 빚의 길까지 없어지는 건 아니겠죠.”'}
  - {beat: 낮의 장터, scene: 선택 결과를 일상 노동으로 검증하고 방향만 남긴다., dialogue: '서하린: “어떤 질문이 따라오는지 정하는 날이에요.”'}
