reentry_recap: 청류문은 한 기능을 되살렸지만 재건은 끝나지 않았다. 빈 당번 칸과 객패의 마지막 이동 방향이 흑사방이 드나들던 장터 뒤 창고와 겹친다. 주인공과 서하린은 적을 쫓지 않고, 빚으로 사람을 묶은 흔적 한 조각만 확인하러 간다.
stable_opening: 장터가 한산한 날 두 사람은 못과 약초를 받으러 오래된 중개 창고에 들른다. 벽 틈에서 검은 비늘 모양 봉랍과 반쪽 숫자표가 떨어지고, 창고 주인은 그것을 보면 가게가 닫힌다고 낮게 말한다.
local_urgent_conflict: 남은 것은 흑사방 채무 장부의 한 조각이다. 가져가면 채무자를 보호할 수 있지만 보복 위험이 커지고, 태우면 강압의 증거가 사라진다. 오늘 조각을 안전하게 보존하되 누구에게도 빚을 대신 약속하지 않아야 한다.
beats_and_dialogue:
  - beat: 숫자표와 사람의 이름
    scene: 숫자 옆의 작은 점이 돈이 아니라 식사·운반·치료의 종류임을 알아낸다. 서하린은 이름을 소리 내지 않고 천으로 가린다.
    dialogue: '서하린: “이름을 크게 읽으면 기록이 아니라 표적이 돼요. 먼저 살아 있는 사람의 위치부터 생각해요.”'
  - beat: 검은 비늘의 표식
    scene: 봉랍은 흑사방 문양이지만 장부 전체를 증명하지 않는다. 창고 주인은 외상 물자와 독촉이 한 줄에 묶였다고 말한다.
    dialogue: '창고 주인: “원장부에서 뜯겨 나온 한 조각이오. 한 조각으로 사람을 죄인 만들진 마시오.”'
  - beat: 강압의 문장
    scene: ‘빌린 자는 다음 사람을 데려오라’는 압축 기호가 보인다. 혈월교의 불이나 사도의 마지막 계산은 없다. 흑사방은 빚과 전달 의무로 이동을 통제했다.
    dialogue: '주인공: “불태운 흔적이 아니라 빚을 이어 붙인 흔적이네요.”'
  - beat: 객패 경로와 겹친 줄
    scene: 객패의 각인과 창고 번호를 겹치면 같은 지점이 나온다. 하지만 최초 소유자가 흑사방 편이었다고 단정할 만큼 완전하지는 않다.
    dialogue: '서하린: “같은 길을 쓴 것과 같은 편이었다는 건 달라요.”'
  - beat: 보여 달라는 사람들
    scene: 창고 주인과 청류문 당번이 조각을 보여 달라고 한다. 주인공은 공개가 협박을 줄이는지, 누가 이름을 가리는지 살핀다.
    dialogue: '주인공: “증거를 나누는 것과 빚을 나누겠다는 약속은 다릅니다.”'
  - beat: 한 조각의 보관법
    scene: 접으면 숫자가 사라지고 펼치면 눈에 띈다. 네 사람은 복사·봉인·소각을 비교한 뒤 원장부를 즉시 찾지 않기로 한다.
    dialogue: '서하린: “오늘 필요한 건 완벽한 장부가 아니라 다음 사람이 확인할 흔적이에요.”'
  - beat: 남은 빚은 물음으로
    scene: 저녁 기록함에는 조각의 탁본과 가려진 이름 목록이 들어간다. 압박은 추격이 아니라 앞으로 물어야 할 질문으로 남는다.
    dialogue: '청우진: “흔적을 얻었다고 빚까지 네가 진 건 아니다.”'
