interlude_safe_state: 야영지에서 식사·수면·보조 장부·손목 보호대·역참 예절을 준비한다. 1~2개 사이드와 약 7개 랜덤 인카운터가 가능하다.
low_pressure_hook: 두 길표 중 하나에 객패와 같은 끊긴 선이 있지만 역참 문 앞까지 어느 길인지 확정하지 않는다.
next_reentry_trigger: 비용 하나와 봉인 인계장이 있고 야영지에서 식사·수면 또는 문턱 연습이 한 번 지나면 3/17이 열린다.
