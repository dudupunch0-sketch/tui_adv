local_closure: 이름·부상·실종 기록은 장부에 남고 파괴 표식과 최초 소유자 각인은 봉인첩에 묶인다. 해독은 부분 방향에서 멈추며 즉시 출발하지 않는다. 식사·애도·보관·수선 계획이 남는다.
interlude_safe_state: 며칠 동안 생존자 식사와 애도, 기록함 봉인 확인, 약방 잡역, 청류문 수선 계획, 회복 훈련을 삽입할 수 있다. 객패와 봉인첩은 청류문 안에 둔다.
low_pressure_hook: 부분 방향을 재건표와 대조하거나 생존자의 동의를 얻어 마지막 물건을 확인하거나 자재와 부상자 순번을 정리할 수 있다.
next_reentry_trigger: 며칠의 애도·회복·보관 뒤 이름표와 부분 방향을 재건표에 안전하게 대조할 준비가 되면 2/13이 열린다. 부분 해독만으로 즉시 이동·추적하지 않는다.
