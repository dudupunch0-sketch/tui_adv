local_closure: 채권 대리인은 압류 철회·임시 봉인·제한부 유예 중 하나로 현장을 떠난다. 청류문은 빈방을 즉시 되찾았다고 과장하지 않으며, 부재한 이름과 확보한 물리 흔적을 기록함으로써 방어를 끝낸다.
interlude_safe_state: 며칠 동안 수면·식사·재건 당번, 증언 기록 정리, 서하린과 채무 책임 대화, 문패와 객패 대조를 삽입할 수 있다. 추심 추적이나 전투는 자동 시작하지 않는다.
low_pressure_hook: 다음 이동 전에 문패의 검은 표식과 객패의 방향을 대조할지, 증언자의 익명성을 지키며 한 번 더 들을지, 제한부 채무 조항을 서하린과 다시 나눌지 선택할 수 있다.
next_reentry_trigger: 며칠의 회복과 기록 정리가 끝나고 청류문이 산길 통행 책임을 맡을 준비가 되면 guestpass_route_to_baesan_opened가 재진입을 열어 준다.
