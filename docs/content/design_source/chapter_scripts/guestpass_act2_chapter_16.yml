    immediate_result: 세 장부를 함께 봉인해 떠나는 사람과 남는 사람의 비용을 공개한다.
    success: 다음 역참에서 객패와 청류문 인계 기록을 같이 제시할 수 있다.
    failure: 숫자가 맞지 않아 상태 기반 장부 대조와 정산이 지연되어 숨은 비용이 드러나 신분 선택의 tradeoff를 설명할 수 있다.
