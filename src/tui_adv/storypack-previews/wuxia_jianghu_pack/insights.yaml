insights:
  - id: insight_breathe_before_bargain
    name: 호흡을 먼저 고른 기록
    description: 서하린의 경계 앞에서 숨을 고르고 말의 순서를 세웠다.
    check_bonus:
      ability: empathy
      bonus: 1

  - id: insight_read_the_flow
    name: 흐름을 읽은 기록
    description: 발을 멈추지 않고 상대의 힘이 빠지는 순간을 기록했다.
    check_bonus:
      ability: physical
      bonus: 1

  - id: insight_name_the_rule
    name: 규칙을 이름 붙인 기록
    description: 낯선 문파의 규칙을 문장으로 정리해 다음 판단의 발판으로 삼았다.
    check_bonus:
      ability: logic
      bonus: 1
