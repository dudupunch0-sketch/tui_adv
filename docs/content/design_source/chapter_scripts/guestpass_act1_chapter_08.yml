rewards:
  - name: 파괴된 귀로객망 표식 탁본
    type: quest_clue
    concept: 환대망 전체가 물리적으로 지워지고 있다는 표식.
  - name: 마지막 세 각인의 배열표
    type: investigation_record
    concept: 최초 소유자의 마지막 이동 순서와 멈춘 방향.
  - name: 재 속의 순서
    type: skill
    concept: 파괴의 순서에서 사람의 행동을 추적하는 조사 감각.
quest_clues:
  - name: 불탄 객패의 이중 기록
    type: main_quest_clue
    concept: 파괴된 귀로객망 표식과 최초 소유자의 마지막 이동 기록이 하나의 인과로 연결된다는 핵심 증거.
  - name: 청류문 손님 명부의 빈 장
    type: investigation_clue
    concept: 오래된 연결을 최근 누군가 지웠을 가능성.
flags:
  always: [guestpass_burnt_token_acquired, guestpass_destroyed_network_mark_present, guestpass_first_owner_last_route_record_present, guestpass_single_causal_chain_opened, guestpass_destroyed_network_mark_seen, guestpass_first_owner_route_notches_seen, bloodmoon_raid_omen_enabled]
  success: [guestpass_network_mark_or_route_preserved_cleanly, qingliu_archive_or_destruction_method_learned]
  failure: [guestpass_followup_repair_cost_recorded]
  follow_up: [qingliu_boundary_watch_strengthened, guestpass_investigation_scheduled]
local_closure: 객패는 주인공의 소유 목록에 들어가지 않는다. 청류문 기록함에 두 흔적이 함께 봉인되고, 산문 순번만 조용히 한 차례 늘어난다. 누구도 즉시 출발하거나 습격하지 않는다.
interlude_safe_state: 며칠 동안 탁본 정리, 청류문 장부 대조, 경계 순번 참여, 잡역, 회복, 서하린과의 저녁 대화를 삽입할 수 있다. 객패는 기록함에 있어 조사 중에도 안전하다.
low_pressure_hook: 외부 표식을 더 조사할지, 청류문 손님 장부의 빈 장을 복원할지, 객패의 환대 관습을 배울지 선택할 수 있다.
next_reentry_trigger: 객패의 두 흔적이 기록함에 봉인된 뒤 며칠간 산문 기록·장부·외부 발자국 중 서로 다른 전조가 누적되어, 청류문이 경계 순번을 재편성할 필요가 생기면 2/09가 열린다.
