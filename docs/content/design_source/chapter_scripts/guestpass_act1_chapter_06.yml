schema_version: 1
kind: chapter_script_companion
script_id: guestpass_act1_chapter_06
event_ref: wuxia_cheongryu_first_breathing_lesson
slot: 1/06
title: 청류심법 첫 호흡
status: authoring_draft
review_status: authoring_review_required
runtime_status: not_implemented
reentry_recap: 주인공은 청류문에서 한 끼와 잠자리를 얻었고, 회복 가능한 생활량을 정했다. 오늘 연무장의 목표는 무공 습득이나 각성이 아니라, 흐르지 않는 몸을 알아차리는 것이다.
stable_opening: 다음 날 아침 이슬이 연무장 돌 틈에 맺혀 있다. 서하린은 도복을 내밀지 않고 주인공의 출근 셔츠 단추 하나만 풀게 한다. 소매를 걷은 팔에는 어제의 붕대가 남아 있고, 발바닥이 돌을 어떻게 느끼는지부터 묻는다.
local_urgent_conflict: 청류심법의 첫 원리는 힘을 한곳에 고정하는 것이 아니라 흘려보내는 것이다. 주인공은 서하린의 호흡을 억지로 복사하면 어지럼과 통증을 얻고, 자기 몸의 속도를 찾으면 수련의 실패를 견딜 수 있다.
beats_and_dialogue:
  - beat: 단추 하나를 푸는 수련
    scene: 주인공은 무림의 복장으로 갈아입지 못한 채 셔츠 깃을 느슨하게 한다. 서하린은 출근복을 부끄러워하지 않고, 옷이 몸을 방해하는 지점을 수련의 일부로 삼는다.
    dialogue: '서하린: “옷을 버려야 몸이 바뀌는 건 아니에요. 어디가 걸리는지 알아야 풀 수 있죠.”'
  - beat: 흐르게 한다는 말
    scene: 서하린은 손바닥에 작은 돌을 올리고 힘을 주지 않은 채 굴린다. 돌은 멈추지 않고 손목 쪽으로 흐른다. 주인공은 그 동작을 따라 하려 하지만 손가락을 먼저 굳힌다.
    dialogue: '서하린: “힘을 빼라는 말은 늘어지라는 뜻이 아니에요. 다음 자리로 보내라는 뜻이에요.”'
  - beat: 첫 호흡의 끊김
    scene: 주인공은 사무실 계단을 오르던 호흡과 전혀 다른 리듬을 만들려다 숨을 참는다. 서하린은 손을 대지 않고, 멈추면 멈춘 곳을 말해 달라고 한다.
    dialogue: '주인공: “가슴은 앞으로 가는데 발은 뒤에 남아 있어요.”\n서하린: “그 사이를 억지로 메우지 말고, 어디서 끊겼는지 기억해요.”'
  - beat: 실패를 몸으로 확인하기
    scene: 세 번의 짧은 시도 중 한 번은 발바닥이 안정되고, 한 번은 어지럼이 오며, 한 번은 아무것도 느끼지 못한다. 서하린은 성공 횟수를 세지 않는다.
    dialogue: '서하린: “오늘 얻은 건 기술이 아니라 기준이에요. 더 하면 망가지는 순간을 알아보는 기준.”'
  - beat: 현대의 리듬을 버리지 않기
    scene: 주인공은 출근길 신호등을 기다리던 호흡과 물 긷기 동작을 비교해 자기 리듬을 적는다. 청류심법은 출신을 지우지 않고 몸의 습관을 다시 읽게 한다.
    dialogue: '주인공: “그럼 제 몸은 틀린 게 아니라, 아직 이곳의 흐름을 모르는 거군요.”\n서하린: “오늘은 그 말이면 충분해요.”'
  - beat: 물 한 잔과 오후 계획
    scene: 수련은 물을 마시고 끝난다. 서하린은 천기록이나 기이한 징조를 꺼내지 않으며, 오후에는 낮잠·세탁·가벼운 잡역 중 하나를 고르게 한다.
    dialogue: '주인공: “눈앞에서 빛이 나거나 힘이 솟는 일은 없네요.”\n서하린: “그런 일은 기대하지 마세요. 오늘은 숨이 돌아온 것만으로도 충분합니다.”'
choices:
  - id: follow_seoharin_breath
    label: 서하린의 호흡 수를 짧게 따라 한다
    immediate_result: 주인공은 서하린의 들숨·멈춤·날숨을 세 번만 따라 한 뒤, 발바닥과 손가락 감각을 말하기로 한다.
    success: 호흡과 발바닥의 감각이 잠깐 연결된다. 서하린은 다음 수련에서 같은 길이를 반복하지 말고, 몸이 기억한 짧은 구간만 찾으라고 한다.
    failure: 수를 맞추려다 숨을 과하게 참아 어지럼이 온다. 서하린은 즉시 앉히고, 따라 하기보다 멈춤을 먼저 기록하는 과제로 바꾼다.
    relationship_directions:
      people:
        seo_harin: trust_through_direct_instruction
        protagonist_self: disciplined_but_not_fixed
      factions:
        qingliu: first_method_observed
    reward_candidate:
      name: 서하린의 세 번 숨
      type: skill
      concept: 남의 호흡을 복사하는 것이 아니라 짧은 지시를 자기 몸의 기준으로 바꾸는 첫 수련 감각.
    quest_clue:
      name: 멈춤 앞의 발바닥
      type: quest_clue
      concept: 다음 훈련 전투에서 균형이 무너지는 순간을 먼저 감지할 수 있는 신체 단서.
    flags:
      always: [first_breath_attempted, modern_body_mismatch_named, tianjilu_not_called]
      success: [breath_and_foot_contact_found]
      failure: [breath_overexertion_recorded, pause_first_method_opened]
  - id: translate_commute_rhythm
    label: 출퇴근 보행 리듬을 수련의 발걸음으로 번역한다
    immediate_result: 주인공은 신호등 앞에서 기다리던 네 박자와 사무실 복도의 보폭을 떠올려, 서하린의 속도 대신 자신의 발걸음에 숨을 맞춘다.
    success: 익숙한 보폭이 청류문 마당의 돌 간격에 맞게 느려진다. 서하린은 현대의 습관을 버리지 않고 변환한 점을 인정한다.
    failure: 출근 시간에 늦던 조급함이 되살아나 보폭이 빨라지고 어깨가 굳는다. 오후에는 걷기와 호흡을 분리해 회복해야 한다.
    relationship_directions:
      people:
        seo_harin: respect_for_self_discovered_method
        protagonist_self: modern_memory_reframed
      factions:
        qingliu: outsider_method_tolerated
    reward_candidate:
      name: 늦지 않기 위한 보폭
      type: insight
      concept: 버려야 할 과거가 아니라 새로운 몸을 이해하는 측정 단위로 현대의 리듬을 쓰는 관점.
    quest_clue:
      name: 연무장 돌 세 칸
      type: clue
      concept: 청류문 마당의 돌 간격과 보폭을 대조하면 다음 수련에서 균형의 원인을 조사할 수 있다.
    flags:
      always: [first_breath_attempted, modern_body_mismatch_named, commute_rhythm_recalled]
      success: [personal_breath_rhythm_found]
      failure: [old_urgency_reactivated, afternoon_recovery_needed]
  - id: stop_and_name_sensation
    label: 멈추고 감각이 끊긴 지점을 말한다
    immediate_result: 주인공은 시범을 중단하고 손가락·발목·가슴 중 어디가 먼저 굳었는지 차례로 말한다. 서하린은 정답 대신 다음 시도의 범위를 줄인다.
    success: 어지럼 전조와 회복에 필요한 자세를 알아낸다. 수련은 짧아졌지만 주인공은 자기 몸을 관찰하는 첫 기록을 얻는다.
    failure: 감각을 설명하려는 동안 서하린의 시범을 놓친다. 대신 주인공은 타인의 동작보다 자신의 한계를 먼저 기록해야 한다는 과제를 받는다.
    relationship_directions:
      people:
        seo_harin: trust_through_honest_observation
        protagonist_self: bodily_awareness_started
      factions:
        qingliu: failure_as_learning_accepted
    reward_candidate:
      name: 끊긴 숨의 여백
      type: skill
      concept: 멈춘 순간을 실패로 지우지 않고 다음 행동을 고르는 정보로 남기는 습관.
    quest_clue:
      name: 어지럼 전조 메모
      type: quest_clue
      concept: 회복 중 전투·잡역에서 중단해야 할 신호를 구체적으로 확인하는 기록.
    flags:
      always: [first_breath_attempted, modern_body_mismatch_named, sensation_named]
      success: [breath_pause_found, recovery_method_known]
      failure: [seoharin_demo_missed, observation_priority_raised]
  - id: connect_breath_to_chore
    label: 물 긷기 동작에 호흡을 붙여 본다
    immediate_result: 주인공은 빈 물동이를 들고 허리·손목·발의 순서를 나누어 움직인다. 서하린은 물을 채우지 않은 상태에서만 시도하게 한다.
    success: 생활 동작 안에서 힘이 한곳에 고이지 않는 순간을 한 번 경험한다. 청류심법이 전투용 기술만은 아니라는 감각이 남는다.
    failure: 물동이가 비어 있어도 손목의 상처가 자극된다. 서하린은 동작을 중지하고 오후 잡역에서 손을 쓰지 않는 일을 배정한다.
    relationship_directions:
      people:
        seo_harin: care_through_practical_adjustment
        cheong_u_jin: routine_safety_respected
      factions:
        qingliu: life_and_training_linked
    reward_candidate:
      name: 빈 물동이의 흐름
      type: skill
      concept: 수련과 잡역을 따로 나누지 않고, 반복 가능한 생활 동작에서 몸의 흐름을 찾는 기술.
    quest_clue:
      name: 손목이 먼저 말한 경고
      type: clue
      concept: 전투나 심부름에서 손목을 보호해야 할 범위가 다음 훈련의 조건으로 남는다.
    flags:
      always: [first_breath_attempted, modern_body_mismatch_named, chore_motion_tested]
      success: [flow_in_daily_motion_seen]
      failure: [wrist_warning_recorded, hand_free_chore_required]
relationship_directions:
  people:
    seo_harin: mentor_trust_growing_through_observation
    protagonist_self: body_not_a_failed_machine
  factions:
    qingliu: training_method_respected
    modern_world: memory_reframed_as_measure
rewards:
  - name: 첫 호흡의 쉼표
    type: insight
    concept: 수련을 멈춘 순간도 몸을 배우는 결과로 기록하는 감각.
  - name: 출근 셔츠의 느슨한 단추
    type: identity_token
    concept: 전이 전 삶을 지우지 않고 새 몸에 맞게 조정한 작은 표식.
quest_clues:
  - name: 연무장 복기 약속
    type: route_clue
    concept: 첫 시도의 오류 하나를 골라 서하린과 다시 검토할 다음 장면.
flags:
  always: [first_breath_attempted, modern_body_mismatch_named, tianjilu_not_called]
  success: [breath_pause_found_or_personal_rhythm_found]
  failure: [training_overexertion_recorded_or_recovery_needed]
local_closure: 서하린은 수련을 더 밀어붙이지 않고 물을 건넨다. 주인공은 강해지지 않았지만, 언제 몸이 굳는지 알아낼 기준을 얻고 연무장을 내려온다.
interlude_safe_state: 낮잠, 세탁, 손을 덜 쓰는 잡역, 호흡 메모, 서하린에게 수련법을 다시 묻는 일이 가능하다. 천기록 발현·힘의 각성·전투 강제는 없다.
low_pressure_hook: 호흡 메모 옆에 장터에서 본 검은 줄과 손목이 굳은 순간이 나란히 적혀, 생활 조사와 훈련 조사가 이어진다.
next_reentry_trigger: first_breath_attempted와 modern_body_mismatch_named가 기록되고, 주인공이 첫 수련 뒤 회복 생활을 한 차례 마친 뒤 대련을 보기 전의 몸 경고 하나를 말하면 1/07이 재진입한다. 1~2개 서브 장과 여러 랜덤 인카운터가 지나도 유효하며 특정 시각이나 짧은 기한은 없다.
cadence_audit:
  time: clear_morning_after_recovery_meal
  place: qingliu_training_yard
  companions: seo_harin
  injury: wrist_recovering_and_overexertion_possible
  information: flow_principle_and_body_warning
  hostile_pressure: self_overexertion_only
scene_context:
  location: 청류문 연무장
  cast: [주인공, 서하린]
  emotional_state: 힘을 얻고 싶은 조급함과 몸을 망치고 싶지 않은 현실감 사이에서 자기 속도를 찾는 상태
convergence:
  meaningful_exclusive_outcomes: 따라 하기는 지시 신뢰, 보행 번역은 현대 기억의 전환, 감각 명명은 관찰, 잡역 연결은 생활형 수련을 남긴다.
  common_minimum_facts: [first_breath_attempted, modern_body_mismatch_named, flow_not_fixation_understood, tianjilu_not_called]
  local_closure: 수련은 실패를 포함한 몸의 기준으로 마무리되고, 오후 회복과 생활 선택이 가능하다.
  exact_state_bridge: 첫 수련 시도와 몸의 경고 한 가지가 기록되고 회복 생활을 거친 뒤 주인공이 작은 대련을 관찰할 준비가 되었다고 말하면 1/07이 열린다.
  next_slot: 1/07
  next_event_ref: wuxia_cheongryu_training_first_failure
  terminal: false
